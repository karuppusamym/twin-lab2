<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TwinLab2{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='portal.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('home') }}">TwinLab2</a>
    {% if current_user() %}
    <nav>
      <a href="{{ url_for('home') }}">Applications</a>
      <a href="{{ url_for('recordings') }}">Recordings</a>
      <a href="{{ url_for('sessions') }}">Request a recording</a>
      <a href="{{ url_for('setup') }}">Setup / Advanced</a>
      <span class="who">{{ current_user() }}</span>
    </nav>
    {% endif %}
  </header>
  <main>{% for category, message in get_flashed_messages(with_categories=true) %}
    <p class="{{ 'error' if category == 'error' else 'notice' }}" role="status">{{ message }}</p>
  {% endfor %}{% block content %}{% endblock %}</main>
</body>
</html>
