name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: twinlab2
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TWINLAB2_TEST_DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgresql://postgres:twinlab2@localhost:5432/postgres' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            contract/pyproject.toml
            server/pyproject.toml
            recorder/pyproject.toml
      # contract/, server/ (with its test and replay extras) and recorder/, editable: no other fetch
      - run: python -m pip install -r requirements-test.txt
      # headless Chromium for the recorder's picture tests (tests/recorder/test_web_pictures.py)
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q -rs
