name: image

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  image:
    name: image (build and smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the OpenShift manifest against the Kubernetes 1.30 (OpenShift 4.17) schemas, unknown fields
      # refused; Route (route.openshift.io) has no published schema: tests/server/test_deploy_manifests.py
      - name: Schema-check deploy/openshift-portal.yaml and openshift-builder.yaml (kubeconform, pinned by digest)
        run: |
          docker run --rm -v "$PWD/deploy:/deploy:ro"             ghcr.io/yannh/kubeconform:v0.6.7@sha256:0925177fb05b44ce18574076141b5c3d83235e1904d3f952182ac99ddc45762c             -strict -summary -kubernetes-version 1.30.0 -skip Route /deploy/openshift-portal.yaml /deploy/openshift-builder.yaml
      - name: Build deploy/Dockerfile (web app stage, then the portal)
        run: docker build -f deploy/Dockerfile -t twinlab2-portal:ci .
      - name: Run it as an arbitrary non-root UID, as OpenShift does
        run: |
          docker run -d --name portal --user 123456:0 -p 127.0.0.1:8080:8080 \
            -e TWINLAB2_HOSTS=localhost,127.0.0.1 -e TWINLAB2_SECRET_KEY=ci-only \
            -e TWINLAB2_TRUSTED_PROXIES=0.0.0.0/0 -e TWINLAB2_PROXY_SECRET=ci-proxy-secret \
            twinlab2-portal:ci gunicorn --bind 0.0.0.0:8080 "twinlab2.app:asgi()"
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/livez && break; sleep 1; done
      - name: The probes, as a kubelet sends them (Host is the pod's IP), and inside the container
        run: |
          set -e
          for path in /livez /readyz /healthz; do
            test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: 10.1.2.3:8080' "http://127.0.0.1:8080$path")" = 200
          done
          curl -fsS -H 'Host: 10.1.2.3:8080' http://127.0.0.1:8080/readyz | tee readyz.json
          grep -q '"database":"ok"' readyz.json && grep -q '"artifacts":"ok"' readyz.json
          # everything else still checks the Host
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: 10.1.2.3:8080' http://127.0.0.1:8080/api/v1/session)" = 400
          curl -fsS -D headers.txt -o /dev/null http://127.0.0.1:8080/api/v1/session
          grep -qi '^request-id: ' headers.txt
          # the exec probes of the manifest (the portal is bound to the pod's loopback there)
          docker exec portal python -m twinlab2.probe http http://127.0.0.1:8080/livez
          docker exec portal python -m twinlab2.probe http http://127.0.0.1:8080/readyz
          # the worker, from the same image as the same arbitrary UID, and its liveness probe
          docker exec -d portal python -m twinlab2.worker
          for i in $(seq 1 30); do docker exec portal python -m twinlab2.probe worker && break; sleep 1; done
          docker exec portal python -m twinlab2.probe worker
      - name: The OAuth proxy's user, the API and the web app
        run: |
          set -e
          # listening on 0.0.0.0 and trusting every peer: the proxy proves itself with the secret
          proxy="X-TwinLab-Proxy-Secret: ci-proxy-secret"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "X-Forwarded-User: ci-user" http://127.0.0.1:8080/api/v1/apps)" = 403
          curl -fsS -H "$proxy" -H "X-Forwarded-User: ci-user" http://127.0.0.1:8080/api/v1/session | tee session.json
          grep -q '"user":"ci-user"' session.json
          grep -q '"auth_mode":"proxy"' session.json
          grep -q '"access_mode":"trusted-proxy"' session.json
          # a sign-in form does not exist behind the proxy
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/api/v1/session)" != 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$proxy" http://127.0.0.1:8080/api/v1/apps)" = 401
          curl -fsS -H "$proxy" -H "X-Forwarded-User: ci-user" http://127.0.0.1:8080/api/v1/apps | grep -q '"apps":\[\]'
          curl -fsS http://127.0.0.1:8080/apps/1 | grep -q '<div id="root">'
          asset=$(curl -fsS http://127.0.0.1:8080/ | grep -o '/assets/[^"]*\.js' | head -1)
          curl -fsS -o /dev/null "http://127.0.0.1:8080$asset"
          docker exec portal id -u | grep -q 123456
      - if: always()
        run: docker logs portal || true
