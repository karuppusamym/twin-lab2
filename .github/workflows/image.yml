name: image

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  image:
    name: image (build and smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deploy/Dockerfile (web app stage, then the portal)
        run: docker build -f deploy/Dockerfile -t twinlab2-portal:ci .
      - name: Run it as an arbitrary non-root UID, as OpenShift does
        run: |
          docker run -d --name portal --user 123456:0 -p 127.0.0.1:8080:8080 \
            -e TWINLAB2_HOSTS=localhost,127.0.0.1 -e TWINLAB2_SECRET_KEY=ci-only \
            twinlab2-portal:ci gunicorn --bind 0.0.0.0:8080 "twinlab2.app:asgi()"
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
      - name: The OAuth proxy's user, the API and the web app
        run: |
          set -e
          curl -fsS -H "X-Forwarded-User: ci-user" http://127.0.0.1:8080/api/v1/session | tee session.json
          grep -q '"user":"ci-user"' session.json
          grep -q '"auth_mode":"proxy"' session.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/apps)" = 401
          curl -fsS -H "X-Forwarded-User: ci-user" http://127.0.0.1:8080/api/v1/apps | grep -q '"apps":\[\]'
          curl -fsS http://127.0.0.1:8080/apps/1 | grep -q '<div id="root">'
          asset=$(curl -fsS http://127.0.0.1:8080/ | grep -o '/assets/[^"]*\.js' | head -1)
          curl -fsS -o /dev/null "http://127.0.0.1:8080$asset"
          docker exec portal id -u | grep -q 123456
      - if: always()
        run: docker logs portal || true
