name: web

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Types match api/openapi.yaml
        run: |
          npm run gen
          git diff --exit-code -- src/api/schema.ts || { echo "::error::src/api/schema.ts is out of date: run npm run gen in web/"; exit 1; }
      - run: npm run lint
      - run: npm run typecheck
      - name: Accessibility (axe on the main pages, token contrast light and dark)
        run: npm run test:a11y
      - run: npm test -- --exclude test/a11y.test.tsx --exclude test/contrast.test.ts
      - run: npm run build
