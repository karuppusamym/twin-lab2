name: web

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Types match api/openapi.yaml
        run: |
          npm run gen
          git diff --exit-code -- src/api/schema.ts || { echo "::error::src/api/schema.ts is out of date: run npm run gen in web/"; exit 1; }
      - run: npm run lint
      - run: npm run typecheck
      - name: Accessibility (axe on the main pages, token contrast light and dark)
        run: npm run test:a11y
      - run: npm test -- --exclude test/a11y.test.tsx --exclude test/contrast.test.ts
      - run: npm run build
