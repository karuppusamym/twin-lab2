name: e2e

# The web app in a real (headless) browser against tools/e2e_portal.py: the real portal on fakes
# only (fake build provider, fake GitHub, fake deployment; no network beyond 127.0.0.1, no secrets).
# tests/e2e: sign-in, workboard, triage, freeze, a build session, Verify and publish, role 403s.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (browser journey)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            contract/pyproject.toml
            server/pyproject.toml
            recorder/pyproject.toml
      - name: Build the web app (web/dist, which the portal serves)
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - name: The browser journey (headless Chromium)
        env:
          TWINLAB2_E2E: "1"
        run: python -m pytest tests/e2e -v -rs
      - name: Traces, page snapshots and the portal's log (on failure)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: test-results/e2e/
          retention-days: 14
          if-no-files-found: ignore
