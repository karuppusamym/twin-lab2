# Dependabot: weekly update pull requests, grouped per ecosystem so they stay reviewable.
# Every PR runs the same checks as any other (test, web, image, e2e, supply-chain) and is merged
# only when they are green. Security updates are raised as soon as an advisory appears.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directories: ["/contract", "/server", "/recorder", "/tools/supply-chain"]
    schedule:
      interval: weekly
    groups:
      python-minor:
        update-types: [minor, patch]
    ignore:
      # anthropic 2.x: the Claude build-session tests time out. Revisit once the SDK change is read.
      - dependency-name: anthropic
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]
    ignore:
      # Majors are a reviewed batch, not a stream of PRs: toolchain pieces move together (eslint with
      # its plugins, react with react-dom and the types, typescript with typescript-eslint, msw and
      # vite, @types/node with the Node in CI). Do them by hand, then lift this rule.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    ignore:
      # The images CI builds and tests: Python 3.12 (image) and Node 22 LTS. Raise them by hand.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # Red Hat registry needs a login; without one the update job fails on this image.
      - dependency-name: openshift4/ose-oauth-proxy
