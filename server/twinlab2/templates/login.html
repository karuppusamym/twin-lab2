{% extends "base.html" %}
{% block title %}Sign in · TwinLab2{% endblock %}
{% block content %}
<h1>Sign in</h1>
<form method="post">
  <input type="hidden" name="token" value="{{ session.form_token }}">
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <label>Your name <input name="user" required autocomplete="username"></label>
  <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
  <button>Sign in</button>
</form>
{% endblock %}
