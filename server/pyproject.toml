[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "twinlab2"
version = "0.2.0"
description = "The TwinLab2 portal: recorded apps, owner review, build packs, build sessions and releases"
license = "Apache-2.0"
requires-python = ">=3.12"
# twinlab2-contract is this repository's contract/: install both at once,
#   pip install -e ./contract -e ./server
dependencies = [
    "twinlab2-contract",
    # the ASGI app (app.py): FastAPI on Starlette; signed session cookies; multipart uploads
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.18",
    "PyYAML>=6",
    "boto3>=1.34",
    "httpx>=0.27,<1",
    # PostgreSQL for a shared deployment (DATABASE_URL=postgresql://...); SQLite needs nothing extra
    "psycopg[binary]>=3.2,<4",
    # Claude build sessions: the clarification conversation (Messages API)
    "anthropic>=0.75,<3",
    # /metrics (observability.py), multiprocess-safe under gunicorn
    "prometheus-client>=0.20,<1",
    # envelope encryption of local artifact files (crypto.py)
    "cryptography>=42",
]

[project.optional-dependencies]
# Verify's scenario replay (twinlab2.replay); then: python -m playwright install chromium
replay = ["playwright>=1.44", "pydantic>=2.6", "pillow>=10"]
# On the machine that runs the build worker, for the providers that run there (tests use fakes)
providers = [
    "claude-agent-sdk>=0.2.186,<0.3",
    # GitHub Copilot build sessions (TWINLAB2_ENABLE_COPILOT=1; authentication and deployment not validated)
    "github-copilot-sdk>=1.0.35,<2",
]
# the container image: gunicorn with uvicorn workers
serve = ["gunicorn>=23,<24", "uvicorn-worker>=0.3,<1"]
# opt-in tracing (TWINLAB2_OTEL=1): spans per request and per worker job, exported over OTLP/HTTP
otel = ["opentelemetry-sdk>=1.25,<2", "opentelemetry-exporter-otlp-proto-http>=1.25,<2"]
# FastAPI's TestClient needs httpx (a dependency already); the contract tests validate every
# /api/v1 response against api/openapi.yaml with jsonschema
test = ["pytest>=8", "jsonschema>=4.18", "referencing>=0.30", "moto[s3,server]>=5.0", "opentelemetry-sdk>=1.25,<2"]

[tool.setuptools.packages.find]
include = ["twinlab2*"]
