[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "twinlab2"
version = "0.2.0"
description = "The TwinLab2 portal: recorded apps, owner review, build packs, build sessions and releases"
license = "Apache-2.0"
requires-python = ">=3.12"
# twinlab2-contract is this repository's contract/: install both at once,
#   pip install -e ./contract -e ./server
dependencies = [
    "twinlab2-contract",
    "Flask>=3.1,<4",
    "PyYAML>=6",
    "boto3>=1.34",
    "httpx>=0.27,<1",
    # PostgreSQL for a shared deployment (DATABASE_URL=postgresql://...); SQLite needs nothing extra
    "psycopg[binary]>=3.2,<4",
    # Claude build sessions: the clarification conversation (Messages API)
    "anthropic>=0.75,<1",
]

[project.optional-dependencies]
# Verify's scenario replay (twinlab2.replay); then: python -m playwright install chromium
replay = ["playwright>=1.44", "pydantic>=2.6", "pillow>=10"]
# On the machine that runs the build worker, for the providers that run there (tests use fakes)
providers = [
    "claude-agent-sdk>=0.2.186,<0.3",
    # GitHub Copilot build sessions (TWINLAB2_ENABLE_COPILOT=1; authentication and deployment not validated)
    "github-copilot-sdk>=1.0.35,<2",
]
serve = ["gunicorn>=23,<24"]
test = ["pytest>=8", "jsonschema>=4.18", "moto[s3,server]>=5.0"]

[tool.setuptools.packages.find]
include = ["twinlab2*"]

[tool.setuptools.package-data]
twinlab2 = ["templates/*.html", "static/*"]
