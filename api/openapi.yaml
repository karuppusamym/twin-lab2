openapi: 3.1.0
info:
  title: TwinLab2 portal API
  version: 1.0.0
  summary: The JSON API behind the TwinLab2 web app (web/), and the recorder agent API.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    The portal's JSON API under `/api/v1/`. Every page of the web app (`web/`) is built from it,
    with the same information and actions the server-rendered pages offered.

    ## Sign-in
    * The web app is served from the same origin as the API and uses relative `/api/v1` URLs. The
      session is the portal's cookie (`cookieSession`), so the app works unchanged when Flask serves
      it and when it sits behind the OpenShift OAuth proxy.
    * `GET /api/v1/session` says who is signed in, how (`auth_mode`), whether a local sign-in form
      exists, the portal's auth mode (`access_mode`: `local-dev`, `individual`, `trusted-proxy`)
      and the caller's role on each application.
    * Local users sign in with `POST /api/v1/session` and out with `DELETE /api/v1/session`. A
      sign-in is a server-side session that expires (`TWINLAB2_SESSION_HOURS`, default 12) and is
      revoked at sign-out and when the user's password changes.
      Behind the OAuth proxy (`auth_mode: proxy`) the user comes from `X-Forwarded-User` and there
      is no local sign-in or sign-out.

    ## CSRF
    Every request other than GET, HEAD and OPTIONS carries the header `X-CSRF-Token` with the
    `csrf_token` from `GET /api/v1/session` (the session's form token). A missing or wrong token is
    refused with 403 problem `code: csrf`. `POST /api/v1/session` (sign in) needs it too: the token
    exists before anyone signs in.

    ## Roles
    Roles are per application and ranked: `viewer` < `builder` < `owner`. A portal admin reads every
    application (as a viewer), manages users, roles and the build setup, but does not get builder or
    owner rights on an application without being assigned them. Each operation states its rule in
    its description and in `x-twinlab-role` (`signed-in`, `public`, `viewer`, `builder`, `owner`,
    `owner-or-admin`, `admin`, `agent-token`, or a rule described in words). The web app shows and
    hides controls from these roles; the server enforces every rule.

    * Recordings and uploaded evidence are **restricted evidence**: a recording is readable only by
      who added it (imported it, or paired the machine that sent it) and by the owners of the
      applications it is linked to; an application's evidence and scenarios only by its owners.
    * Freezing a builder package needs the owner's explicit approval **and** the SHA-256 of the
      previewed draft: if the draft changed since the preview, the freeze is refused with 409.
    * Builders (and owners) get frozen packages, start build sessions and chat with them.

    ## Errors
    Every error is `application/problem+json` (RFC 9457) with the `Problem` shape: `type`,
    `status`, `title`, `detail` (the sentence to show), `code`, `request_id`, and per-field
    `errors` where a request body is not valid. `code` is one of `ErrorCode` (a status without a
    more specific reason has its default: 400 `invalid_request`, 403 `forbidden`, 404
    `not_found`, 409 `state_conflict`, 500 `internal`, ...). `type` is the URI reference
    `/errors/<code>`, relative to the portal: stable per code, and `GET /errors/<code>` answers
    what it means. A client acts on `code` (or `type`), never on the `detail` text. A 403 `role`
    on an application says how to get access: `owners` lists the application's owners when the
    caller may see them (they hold a role on it, or are an admin).

    ## Request ids
    Every response carries `Request-Id`. A request's own `Request-Id` (or `X-Request-Id`) of 8
    to 128 characters `[A-Za-z0-9._:-]` is kept, otherwise the portal makes one. The portal logs
    every request with it, and a problem repeats it as `request_id`: quote it when reporting an
    error.

    ## Idempotency
    The create-type POSTs take an `Idempotency-Key` header (1 to 255 visible ASCII characters,
    one per intended action, e.g. per rendered form). The portal keeps the key with the caller for
    24 hours:
    * the same key with the same request (method, path and body) gives the first outcome again,
      with `Idempotent-Replayed: true`, and creates nothing twice;
    * the same key with a different request is refused with 422 `idempotency_key_reused`;
    * the same key while the first request is still running gives 409 `idempotency_in_progress`
      (retry after `Retry-After`);
    * a request that failed keeps nothing: send it again with the same key.

    The build-session operations had a `request_key` body member for this; it stays accepted as an
    alias of the header (both given must be equal, else 400 `idempotency_key_mismatch`). Their
    replay answers from the session as it is now, with `created: false`.

    ## Conditional GETs
    The polling endpoints of the build chat (`GET /api/v1/builds/{build_id}`,
    `GET /api/v1/apps/{app_id}/builds`) send an `ETag`. A poll that sends it back as
    `If-None-Match` gets 304 without a body while nothing changed.

    ## Deprecations
    A deprecated member or operation is marked `deprecated: true` here, and responses that carry
    it send `Deprecation: true`; the description names the replacement. It keeps working within
    `/api/v1` (see Versioning).

    ## Versioning
    `/api/v1` changes only additively: new operations, new optional request members, new response
    members, new `ErrorCode` values and new enum values in responses a client must tolerate.
    Nothing is removed, renamed or made stricter within v1; a breaking change means `/api/v2`,
    served alongside v1 for a transition. `info.version` follows semver for the document. The
    recorder agent API (`/api/agent`, `/api/uploads`) is versioned separately by its recorder
    contract version (RECORDER-CONTRACT.md); see docs/api-versioning.md.

    ## Conditional updates (revisions)
    Owner-edited resources carry a `revision`: an assignment of a recording's events
    (`Assignment`, 0 while none is saved), a scenario (`Scenario`) and an application's own fields
    and setup (`AppDetail.revision`, `AppSetup.app.revision`). It is 1 when the resource is
    created and goes up by one on every change, a resend of a recording that suggests new events
    included. An update names the revision it was made from with `expected_revision` (in the body;
    in the query for a DELETE) or the header `If-Match: "<revision>"`. If the resource changed
    since, the update is refused with **409 `code: conflict`** and the problem's `current` is the
    resource as the server has it now (the same shape the GET answers), so the page can compare
    "yours" with "theirs". An update without a revision is applied unconditionally; the web app
    always sends one.

    ## Pagination
    Lists that grow with use are paginated with `limit` and `offset` query parameters and answer
    a `page` object: `total` (items matching the filters), `limit`, `offset` and `next_offset`
    (null on the last page). `limit` is 1 to 200 (the default differs per list and is stated on
    the operation); an `offset` past the end gives an empty page. Paginated: the catalog
    (`GET /api/v1/apps`), the recordings list (`GET /api/v1/recordings`) and a recording's
    events (`GET /api/v1/recordings/{recording_id}/events`).

    ## Downloads
    Download operations answer with the file (`application/zip`, `application/json`) or with a 302
    redirect to a short-lived presigned URL when artifact storage is S3. The web app links to them
    directly (same-origin cookie), so they are plain `<a href>` links.

    ## Recorder agent API
    The endpoints tagged `agent` (`/api/agent/...`, `/api/uploads...`) are used by the Windows
    recorder with its machine token (`agentToken`). They are unchanged and documented here only for
    completeness; RECORDER-CONTRACT.md is their contract.
servers:
  - url: /
    description: Same origin as the web app.
security:
  - cookieSession: []
tags:
  - name: session
    description: Sign-in, sign-out, who am I.
  - name: apps
    description: The catalog of applications, their details, roles, setup and merging.
  - name: evidence
    description: Restricted evidence of an application (owners only) and its scenarios.
  - name: recordings
    description: Recordings, the applications and steps each holds, and their assignment to applications.
  - name: capture
    description: Requesting a recording on a paired machine.
  - name: machines
    description: Recorder machines and pairing codes.
  - name: automations
    description: Automations (bots and processes) recordings are made for.
  - name: packages
    description: Builder packages per application, the draft preview and freezing.
  - name: builds
    description: Build sessions (Devin, Claude, Copilot), their chat, and comparing results.
  - name: releases
    description: Releases Packaged → Tested → Published, deployments and verification.
  - name: setup
    description: Setup / Advanced, build setup (admins).
  - name: users
    description: Local users and portal admins (admins).
  - name: access
    description: Requesting a role on an application, and its owners' decisions.
  - name: audit
    description: Append-only audit history.
  - name: operations
    description: Operating the portal (admins) — retention, deletion, purges, tombstones, audit export, storage encryption.
  - name: agent
    description: The recorder agent API (machine token). Unchanged; see RECORDER-CONTRACT.md.

paths:
  # ---------------------------------------------------------------------------------------------
  # session
  # ---------------------------------------------------------------------------------------------
  /api/v1/session:
    get:
      tags: [session]
      operationId: getSession
      summary: Who is signed in, and their roles
      description: Always 200. `signed_in` is false when nobody is signed in (then `user` is null).
      x-twinlab-role: public
      security: []
      responses:
        "200":
          description: The current session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
              examples:
                owner: { $ref: "#/components/examples/SessionOwner" }
                builder: { $ref: "#/components/examples/SessionBuilder" }
                viewer: { $ref: "#/components/examples/SessionViewer" }
                admin: { $ref: "#/components/examples/SessionAdmin" }
                signedOut: { $ref: "#/components/examples/SessionSignedOut" }
    post:
      tags: [session]
      operationId: signIn
      summary: Sign in a local user
      description: Only when `login_available` (not behind the OAuth proxy). Wrong name or password is 401.
      x-twinlab-role: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignIn" }
            examples:
              ana: { value: { user: ana, password: correct horse } }
      responses:
        "200":
          description: Signed in; the new session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
              examples:
                owner: { $ref: "#/components/examples/SessionOwner" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Wrong name or password.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                wrong:
                  value: { type: about:blank, title: Unauthorized, status: 401, detail: Wrong name or password., code: wrong_credentials }
        "404":
          description: No local sign-in here (behind the OAuth proxy, or no local users).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      tags: [session]
      operationId: signOut
      summary: Sign out
      x-twinlab-role: public
      security: []
      responses:
        "204": { description: "Signed out." }

  # ---------------------------------------------------------------------------------------------
  # apps
  # ---------------------------------------------------------------------------------------------
  /api/v1/apps:
    get:
      tags: [apps]
      operationId: listApps
      summary: The catalog (Applications page)
      description: |
        The applications the caller has any role on (an admin: all), each with its journey and its
        latest Tested or Published release; and the recordings the caller may open (restricted evidence).
        Paginated (default `limit` 50) and filtered: `q` matches the name, purpose or owner
        (case-insensitive), `owner`, `status` and `stage` (a journey title) match exactly. `sort` is
        `name`, `owner`, `status` or `stage`, `-` first for descending; the default is the catalog
        order (out-of-scope applications last, then by name). `filters` lists the owners and stages
        to choose from (of every visible application, not only this page). `recordings` is the
        first 50 recordings the caller may open; the recordings list has them all.

        The page is grouped by status family (`AppSummary.family`: needs a scope decision, in
        build, tested, published, not replicated, in that order; the sort applies within each
        family). `groups` counts every matching application per family, also those of other pages.
        `collapsed` names families whose applications are counted but left out of the pages, so
        a collapsed group takes no room on any page; each other group's `offset` is where its
        first application is, to page straight to it.
      x-twinlab-role: signed-in
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: owner, in: query, schema: { type: string, maxLength: 120 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/AppStatus" } }
        - { name: stage, in: query, schema: { type: string, maxLength: 120 } }
        - { name: sort, in: query, schema: { type: string, enum: [name, -name, owner, -owner, status, -status, stage, -stage] } }
        - name: collapsed
          in: query
          description: Families to count but leave out of the pages (repeat the parameter for more than one).
          schema: { type: array, items: { $ref: "#/components/schemas/AppFamily" }, maxItems: 5 }
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalog" }
              examples:
                catalog: { $ref: "#/components/examples/Catalog" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [apps]
      operationId: createApp
      x-twinlab-idempotent: stored
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Add an application
      description: |
        Whoever creates an application owns it; a named `owner` is assigned the owner role too.
        Who may add one is `TWINLAB2_APP_CREATORS`: `owners` (the default: a portal admin, or anyone
        who owns an application already), `admins`, or `anyone` signed in. Others get 403 `role`;
        `Session.can_create_apps` says which applies to the caller.
      x-twinlab-role: signed-in (see description)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewApp" }
            examples:
              new: { value: { name: Order Portal, owner: ana, purpose: Order entry demo } }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppRef" }
              examples:
                created: { value: { id: 4, name: Order Portal } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/apps/{app_id}:
    parameters: [{ $ref: "#/components/parameters/AppId" }]
    get:
      tags: [apps]
      operationId: getApp
      summary: One application (its page)
      description: |
        Viewer and up. `packages` (builder-approved revisions) is empty unless the caller is a
        builder or owner. Owner-only parts of the page (evidence, scenarios, merge) come from their
        own endpoints.
      x-twinlab-role: viewer
      responses:
        "200":
          description: The application.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppDetail" }
              examples:
                owner: { $ref: "#/components/examples/AppDetailOwner" }
                viewer: { $ref: "#/components/examples/AppDetailViewer" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [apps]
      operationId: updateApp
      summary: Change name, purpose, repository or scope decision
      description: |
        Owner. Only the fields sent change. `status` is the scope decision (audited as `app.status`);
        `owner` assigns that user the owner role. With `expected_revision` (or `If-Match`) a stale
        change is refused with 409 `conflict` and the current application (see Conditional updates).
      x-twinlab-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppUpdate" }
            examples:
              purpose: { value: { purpose: Invoice from saved orders, expected_revision: 3 } }
      responses:
        "200":
          description: The changed application.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppDetail" }
              examples:
                owner: { $ref: "#/components/examples/AppDetailOwner" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/apps/{app_id}/roles:
    parameters: [{ $ref: "#/components/parameters/AppId" }]
    get:
      tags: [apps]
      operationId: listRoles
      summary: Who has access to the application
      x-twinlab-role: viewer
      responses:
        "200":
          description: The role assignments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleList" }
              examples:
                roles: { $ref: "#/components/examples/Roles" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/apps/{app_id}/roles/{user_name}:
    parameters:
      - { $ref: "#/components/parameters/AppId" }
      - name: user_name
        in: path
        required: true
        schema: { type: string, maxLength: 120 }
    put:
      tags: [apps]
      operationId: assignRole
      summary: Assign a role
      description: The application's owners and portal admins. Audited as `role.assign`.
      x-twinlab-role: owner-or-admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleUpdate" }
            examples:
              builder: { value: { role: builder } }
      responses:
        "200":
          description: The assignments after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleList" }
              examples:
                roles: { $ref: "#/components/examples/Roles" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [apps]
      operationId: removeRole
      summary: Remove a role
      description: The application's owners and portal admins. The last owner cannot be removed (400). Audited as `role.remove`.
      x-twinlab-role: owner-or-admin
      responses:
        "200":
          description: The assignments after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleList" }
              examples:
                roles: { $ref: "#/components/examples/Roles" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/apps/{app_id}/history:
    parameters: [{ $ref: "#/components/parameters/AppId" }]
    get:
      tags: [audit]
      operationId: getAppHistory
      summary: The application's audit history
      description: Its owners and portal admins. Append-only, newest first.
      x-twinlab-role: owner-or-admin
      responses:
        "200":
          description: The history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/History" }
              examples:
                history: { $ref: "#/components/examples/History" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/apps/{app_id}/setup:
    parameters: [{ $ref: "#/components/parameters/AppId" }]
    get:
      tags: [apps]
      operationId: getAppSetup
      summary: Setup / Advanced of an application
      description: Owner. Identities, Git repository, release verification settings, deployments.
      x-twinlab-role: owner
      responses:
        "200":
          description: The setup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSetup" }
              examples:
                setup: { $ref: "#/components/examples/AppSetup" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/apps/{app_id}/identities:
    parameters: [{ $ref: "#/components/parameters/AppId" }]
    post:
      tags: [apps]
      operationId: addIdentity
      x-twinlab-idempotent: stored
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Add an identity (executable, web address, mainframe host, desktop product)
      description: Owner. 409 when another application already has it or matches the same host and path.
      x-twinlab-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdentityInput" }
            examples:
              web: { value: { key: https://billing.example.test/desk } }
      responses:
        "201":
          description: Added; the setup after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSetup" }
              examples:
                setup: { $ref: "#/components/examples/AppSetup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/apps/{app_id}/url-match:
    parameters: [{ $ref: "#/components/parameters/AppId" }]
    put:
      tags: [apps]
      operationId: setUrlMatch
      summary: How the application's web addresses match (path or the whole host)
      x-twinlab-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UrlMatchInput" }
            examples:
              host: { value: { url_match: host } }
      responses:
        "200":
          description: The setup after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSetup" }
              examples:
                setup: { $ref: "#/components/examples/AppSetup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/apps/{app_id}/data-backend:
    parameters: [{ $ref: "#/components/parameters/AppId" }]
    put:
      tags: [apps]
      operationId: setDataBackend
      summary: The demo's data backend (SQLite, PostgreSQL, SQL Server), or empty to predict it from the data model
      x-twinlab-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DataBackendInput" }
            examples:
              sqlserver: { value: { data_backend: sqlserver, expected_revision: 3 } }
      responses:
        "200":
          description: The setup after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSetup" }
              examples:
                setup: { $ref: "#/components/examples/AppSetup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/apps/{app_id}/verification-settings:
    parameters: [{ $ref: "#/components/parameters/AppId" }]
    put:
      tags: [releases]
      operationId: saveVerificationSettings
      summary: What a release needs before it is Tested
      x-twinlab-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerificationSettings" }
            examples:
              web: { value: { required_checks: "build\ntest (*)", target_platform: web, windows_check_pattern: "", lab_url: "", launch: Open the demo URL. } }
      responses:
        "200":
          description: The setup after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSetup" }
              examples:
                setup: { $ref: "#/components/examples/AppSetup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/apps/{app_id}/verify-commit:
    parameters: [{ $ref: "#/components/parameters/AppId" }]
    post:
      tags: [releases]
      operationId: verifyCommit
      x-twinlab-idempotent: native
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Verify this build (a repository's commit, optionally a build session's)
      description: >-
        Owner. Checks the request (a full SHA, a scenario, a frozen package), then queues the verification:
        202 with the `Verification` to follow. The worker packages the commit (its release is known then),
        reads its checks and runs the release checks. Idempotent by `Idempotency-Key` (or its alias
        `request_key`: one verification per key); without one, a request
        while a verification of the same commit is queued or running gets that one. Audited as `release.verify`.
      x-twinlab-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyCommitInput" }
            examples:
              commit: { value: { repo: example/billing-desk-demo, sha: 3f9a1c2d4e5b6a7980a1b2c3d4e5f60718293a4b, pr_number: 12, request_key: verify-7-3f9a1c2d } }
      responses:
        "202": { $ref: "#/components/responses/Verification" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/apps/{app_id}/releases:
    parameters: [{ $ref: "#/components/parameters/AppId" }]
    post:
      tags: [releases]
      operationId: registerRelease
      summary: Register a release from a commit or a build session
      description: |
        A Packaged release of a commit, from GitHub: a build session's head commit (`build_id`; its
        repository, pull request, branch and package revision), or `sha` in the demo repository
        (`repo` to name another), answering the latest frozen package. A commit already registered
        is returned (`created` false). Registering does not verify: the release page's
        verification is the next step. Replaces the README's `release` command for the main flow.
      x-twinlab-role: builder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReleaseInput" }
            examples:
              fromSession: { value: { build_id: 3 } }
              fromCommit: { value: { sha: 7c41e9b2d05f3a68c1e4b97a20d6f58e3b9c1a74 } }
      responses:
        "201":
          description: Registered (or the existing release of that commit).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseRegistered" }
              examples:
                registered:
                  value:
                    release: { id: 8, version: 7c41e9b2d05f, label: "1.2", revision: 4be1c0ffee51a8d2e9f04b17c6a3d58e2f9b01c4, commit_sha: 7c41e9b2d05f3a68c1e4b97a20d6f58e3b9c1a74, archive_sha: 5d0c2e7a4f9b81c63e2d17a05b9f4c8e1a36d2b70f5c9e84a1b3d6f2e07c5a98, state: packaged }
                    created: true
                    href: /releases/8
                    next: "Verify the release: replay the recorded examples against its deployment."
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/apps/{app_id}/merge-plan:
