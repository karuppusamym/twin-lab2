                plan: { $ref: "#/components/examples/MergePlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/apps/{app_id}/merge:
    parameters: [{ $ref: "#/components/parameters/AppId" }]
    post:
      tags: [apps]
      operationId: mergeApp
      summary: Merge this application into another
      description: |
        Owner of both. `confirm` is the plan's fingerprint: if the applications changed since the
