  /api/v1/apps/{app_id}/interfaces:
    parameters: [{ $ref: "#/components/parameters/AppId" }]
    get:
      tags: [packages]
      operationId: listInterfaces
      summary: Interface contracts with the applications recorded together
      description: |
        Owner. One contract per recording in which this application and at least one other have
        selected events: the stored one when an owner edited it, else the one inferred from the
        recording (shared synthetic identifiers, producer and consumer relationships with API and
        file schemas, launch and reset order, what a consumer does when its producer is down).
      x-twinlab-role: owner
      responses:
        "200":
          description: The contracts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InterfaceList" }
              examples:
                interfaces: { $ref: "#/components/examples/InterfaceList" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/apps/{app_id}/interfaces/{recording_id}:
    parameters:
      - { $ref: "#/components/parameters/AppId" }
      - { name: recording_id, in: path, required: true, schema: { type: string } }
    put:
      tags: [packages]
      operationId: saveInterface
      summary: Save the owner's edit of an interface contract
      description: Owner of this application (one of the contract's). With `expected_revision` a stale save is refused with 409 `conflict`.
      x-twinlab-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InterfaceInput" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InterfaceContract" }
              examples:
                interfaceContract: { $ref: "#/components/examples/InterfaceContract" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [packages]
      operationId: resetInterface
      summary: Back to the contract inferred from the recording
      x-twinlab-role: owner
      responses:
        "204": { description: "Reset." }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/apps/{app_id}/confirmations/{item}:
    parameters:
      - { $ref: "#/components/parameters/AppId" }
      - { name: item, in: path, required: true, schema: { type: string } }
    put:
      tags: [packages]
      operationId: confirmItem
      summary: Confirm a completeness item (evidence level owner-confirmed)
      x-twinlab-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmationInput" }
      responses:
        "200":
          description: Confirmed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Confirmation" }
              examples:
                confirmation: { $ref: "#/components/examples/Confirmation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [packages]
      operationId: unconfirmItem
      summary: Withdraw a confirmation
      x-twinlab-role: owner
      responses:
        "204": { description: "Withdrawn." }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/apps/{app_id}/packages:
    parameters: [{ $ref: "#/components/parameters/AppId" }]
    get:
      tags: [packages]
      operationId: listPackages
      summary: Builder-approved package revisions, newest first
      x-twinlab-role: builder
      responses:
        "200":
          description: The revisions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageList" }
              examples:
                packages: { $ref: "#/components/examples/PackageList" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [packages]
      operationId: freezePackage
      x-twinlab-idempotent: stored
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Freeze the previewed draft as the next revision
      description: |
        Owner. The owner's explicit approval (`approve: true`) of exactly the bytes previewed:
        `sha256` must be the SHA-256 of the current draft from `GET .../package-draft`. If the
        draft changed since the preview, or nothing changed since the latest revision, 409
        (`code: draft_changed` / `unchanged`). Needs a business scenario (400). Audited as `package.freeze`.

        A draft with critical completeness gaps (`completeness.passed: false` on the preview) is
        refused with 409 `code: incomplete_package` (one `errors` entry per critical gap: `field`
        is the spec item) unless `override_reason` gives a written reason (at least 10
        characters). The package then carries the reason and those gaps ("Known gaps" in
        BUILD_TASK.md, `known_gaps` in evidence.json and on the revision), so `sha256` must be that
        of the draft previewed with the same `override_reason`. Audited as
        `package.freeze_override`.
      x-twinlab-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FreezeInput" }
            examples:
              freeze: { value: { sha256: 8d2f4b6a0c1e3f5a7b9d1c3e5f7a9b1d3c5e7f9a1b3d5c7e9f1a3b5d7c9e1f3a, summary: Adds the unpaid-order scenario., approve: true } }
      responses:
        "201":
          description: Frozen; the new revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageRevision" }
              examples:
                rev3: { $ref: "#/components/examples/PackageRevision3" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The draft changed since the preview, is unchanged since the latest revision, or misses critical items without an override reason.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                changed:
                  value: { type: about:blank, title: Conflict, status: 409, detail: The package changed since you previewed it. Preview it again before approving., code: draft_changed }
                incomplete:
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    detail: "The package misses 1 critical item: Expected result of each scenario. Add them, or freeze it anyway with a written reason (at least 10 characters)."
                    code: incomplete_package
                    errors:
                      - { field: scenario.expected, message: "Expected result of each scenario. Scenario \"Invoice an order\" does not state its expected result." }

  /api/v1/apps/{app_id}/package-draft:
    parameters: [{ $ref: "#/components/parameters/AppId" }]
    get:
      tags: [packages]
      operationId: previewPackageDraft
      summary: The draft package exactly as freezing would store it
      description: |
        Owner. Every file with its size and SHA-256 (text files in full), the archive's SHA-256 to
        approve, the pre-freeze report (what was excluded or redacted, and why) and the
        completeness of the draft against the package completeness spec
        (docs/PACKAGE-COMPLETENESS.md): a score per section and every gap with the page and action
        that fix it. 400 without a business scenario.

        With `override_reason` (at least 10 characters) and critical gaps, the draft carries the
        reason and those gaps as "Known gaps": the bytes a freeze with that reason stores.
      x-twinlab-role: owner
      parameters:
        - { name: override_reason, in: query, required: false, schema: { type: string, maxLength: 2000 }, description: "The owner's reason to freeze over critical gaps." }
      responses:
        "200":
          description: The draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageDraft" }
              examples:
                draft: { $ref: "#/components/examples/PackageDraft" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/apps/{app_id}/packages/{rev}:
    parameters:
      - { $ref: "#/components/parameters/AppId" }
      - { $ref: "#/components/parameters/Rev" }
    get:
      tags: [packages]
      operationId: getPackage
      summary: One frozen revision
      description: Builder. `report` (the pre-freeze report) is null unless the caller is an owner.
      x-twinlab-role: builder
      responses:
        "200":
          description: The revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageRevision" }
              examples:
                rev2: { $ref: "#/components/examples/PackageRevision2" }
                rev3: { $ref: "#/components/examples/PackageRevision3" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/apps/{app_id}/packages/{rev}/download:
    parameters:
      - { $ref: "#/components/parameters/AppId" }
      - { $ref: "#/components/parameters/Rev" }
    get:
      tags: [packages]
      operationId: downloadPackage
      summary: Download a frozen revision
      description: Builder. Checked against the approved SHA-256 (500 if the stored bytes differ). Audited as `package.download`.
      x-twinlab-role: builder
      responses:
        "200": { $ref: "#/components/responses/Zip" }
        "302": { $ref: "#/components/responses/Presigned" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/apps/{app_id}/build-pack:
    parameters: [{ $ref: "#/components/parameters/AppId" }]
    get:
      tags: [packages]
      operationId: downloadLatestPackage
      summary: Download the latest builder-approved package
      description: Builder. 400 before an owner has frozen one.
      x-twinlab-role: builder
      responses:
        "200": { $ref: "#/components/responses/Zip" }
        "302": { $ref: "#/components/responses/Presigned" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/apps/{app_id}/briefs/{revision}/download:
    parameters:
      - { $ref: "#/components/parameters/AppId" }
      - { name: revision, in: path, required: true, schema: { type: string } }
    get:
      tags: [packages]
      operationId: downloadByRevision
      summary: Download a package by its content revision
      description: Builder for a frozen revision; a brief stored before packages were frozen only for owners.
      x-twinlab-role: builder (owner for a legacy brief)
      responses:
        "200": { $ref: "#/components/responses/Zip" }
        "302": { $ref: "#/components/responses/Presigned" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------------------------------------
  # builds
  # ---------------------------------------------------------------------------------------------
  /api/v1/apps/{app_id}/builds:
    parameters: [{ $ref: "#/components/parameters/AppId" }]
    get:
      tags: [builds]
      operationId: getBuildPage
      summary: Build sessions of the application (Build page)
      description: |
        Builder. The approved package (`pack`, null with `problem` before an owner froze one), the
        providers and whether each is ready, connected repositories, revisions, and every session.
        Conditional: `If-None-Match` with the last `ETag` gives 304 while nothing changed.
      x-twinlab-role: builder
      parameters: [{ $ref: "#/components/parameters/IfNoneMatch" }]
      responses:
        "304":
          description: Unchanged since the `ETag` sent.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
        "200":
          description: The build page.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildPage" }
              examples:
                page: { $ref: "#/components/examples/BuildPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [builds]
      operationId: startBuild
      x-twinlab-idempotent: native
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Start a build session
      description: |
        Builder. Sends only an owner-frozen revision. `request_key` makes the start idempotent: the
        same key answers the session it already started (`created: false`, with a `notice`).
        Audited as `build.start`.
      x-twinlab-role: builder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewBuild" }
            examples:
              claude: { value: { provider: claude, revision: 5d1e2f3a4b5c6d7e8f901a2b3c4d5e6f7a8b9c0d, repo: example/billing-desk-demo, base_branch: main, change_summary: Adds the unpaid-order scenario., budget: 20, request_key: 6f1c2a9e0b7d4c3a8e5f1b2d3c4a5e6f } }
      responses:
        "201":
          description: Started (or the session this request key already started).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildStarted" }
              examples:
                started: { $ref: "#/components/examples/BuildStarted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/apps/{app_id}/builds/compare:
    parameters: [{ $ref: "#/components/parameters/AppId" }]
    get:
      tags: [builds]
      operationId: compareBuilds
      summary: Compare results of build sessions
      description: Builder. Without `session`, every session with a commit.
      x-twinlab-role: builder
      parameters:
        - name: session
          in: query
          style: form
          explode: true
          schema: { type: array, items: { type: integer } }
      responses:
        "200":
          description: The comparison.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comparison" }
              examples:
                comparison: { $ref: "#/components/examples/Comparison" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [builds]
      operationId: runComparison
      summary: Run the acceptance checks on every candidate
      description: Owner. Release verification of each session's commit. Per-session refusals come back in `errors`.
      x-twinlab-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompareInput" }
            examples:
              two: { value: { sessions: [7, 8] } }
      responses:
        "200":
          description: The comparison after the checks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comparison" }
              examples:
                comparison: { $ref: "#/components/examples/Comparison" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/builds/{build_id}:
    parameters: [{ $ref: "#/components/parameters/BuildId" }]
    get:
      tags: [builds]
      operationId: getBuild
      summary: One build session with its conversation
      description: |
        Builder of the session's application. Poll while `build.final` is false (the old page
        refreshed every 10 s), sending the last `ETag` as `If-None-Match`: 304 while nothing changed.
      x-twinlab-role: builder
      parameters: [{ $ref: "#/components/parameters/IfNoneMatch" }]
      responses:
        "304":
          description: Unchanged since the `ETag` sent.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
        "200":
          description: The session.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildDetail" }
              examples:
                waiting: { $ref: "#/components/examples/BuildDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/builds/{build_id}/cancel:
    parameters: [{ $ref: "#/components/parameters/BuildId" }]
    post:
      tags: [builds]
      operationId: cancelBuild
      summary: Cancel the session
      x-twinlab-role: builder
      responses:
        "200": { $ref: "#/components/responses/BuildDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/builds/{build_id}/interrupt:
    parameters: [{ $ref: "#/components/parameters/BuildId" }]
    post:
      tags: [builds]
      operationId: interruptBuild
      summary: Interrupt the provider (when it can be interrupted)
      x-twinlab-role: builder
      responses:
        "200": { $ref: "#/components/responses/BuildDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/builds/{build_id}/retry:
    parameters: [{ $ref: "#/components/parameters/BuildId" }]
    post:
      tags: [builds]
      operationId: retryBuild
      x-twinlab-idempotent: native
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Retry a failed or cancelled session as a new session
      x-twinlab-role: builder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestKey" }
            examples:
              key: { value: { request_key: 0c9b8a7f6e5d4c3b2a1f0e9d8c7b6a5f } }
      responses:
        "201":
          description: The new session (or the one this key already started).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildStarted" }
              examples:
                started: { $ref: "#/components/examples/BuildStarted" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/builds/{build_id}/messages:
    parameters: [{ $ref: "#/components/parameters/BuildId" }]
    post:
      tags: [builds]
      operationId: answerBuild
      x-twinlab-idempotent: native
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Send an answer to the provider (chat)
      description: |
        Builder. A clarification is sent to the provider (audited as `build.answer`). With
        `scope_change: true` it is **not** sent: it becomes a proposed scenario an owner reviews as a
        new package revision, and `notice` says so.
      x-twinlab-role: builder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnswerInput" }
            examples:
              answer: { value: { answer: VAT is added after the discount., scope_change: false, reply_to: 31, request_key: 1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d } }
      responses:
        "201":
          description: The message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnswerResult" }
              examples:
                sent: { $ref: "#/components/examples/AnswerResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/builds/{build_id}/tool-decisions/{message_id}:
    parameters:
      - { $ref: "#/components/parameters/BuildId" }
      - { name: message_id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [builds]
      operationId: decideTool
      x-twinlab-idempotent: native
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Approve or deny a tool the provider asks to run
      description: Builder. Audited as `build.tool_decision`.
      x-twinlab-role: builder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ToolDecision" }
            examples:
              approve: { value: { decision: approve, request_key: "tool:32:approve" } }
      responses:
        "200": { $ref: "#/components/responses/BuildDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ---------------------------------------------------------------------------------------------
  # recordings
  # ---------------------------------------------------------------------------------------------
  /api/v1/recordings:
    get:
      tags: [recordings]
      operationId: listRecordings
      summary: Recordings the caller may open
      description: |
        Restricted evidence. Only recordings the caller added, or that are linked to an application
        the caller owns; newest first. Paginated (default `limit` 50); `q` matches the name.
      x-twinlab-role: signed-in (filtered to the recording's reviewers)
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: The recordings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordingList" }
              examples:
                recordings: { $ref: "#/components/examples/RecordingList" }
          headers:
            Deprecation: { $ref: "#/components/headers/Deprecation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [recordings]
      operationId: importRecording
      summary: Import a recording file (steps.jsonl)
      description: |
        Signed in. The recording id is the digest of its events. A recovered upload of the same
        session merges by `event_id`; a conflicting event is 409. Audited as `recording.import`.
      x-twinlab-role: signed-in
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/RecordingImport" }
      responses:
        "201":
          description: Imported.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordingRef" }
              examples:
                imported: { value: { id: 9f2c4e1a7b3d5f60, name: Order to invoice } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/recordings/{recording_id}:
    parameters: [{ $ref: "#/components/parameters/RecordingId" }]
    get:
      tags: [recordings]
      operationId: getRecording
      summary: One recording
      description: |
        Restricted evidence: its uploader and the owners of the applications it is linked to (else
        403). Completeness, preflight, upload progress, evidence preview per application, and the
        applications the recording holds, **each with its own steps and its own latest
        builder-approved package** (null when there is none or the caller is not a builder of it).
        `events` is the first 200 events (`events_total` counts them all); the events operation
        pages through them all with search.
      x-twinlab-role: recording reviewer
      responses:
        "200":
          description: The recording.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordingDetail" }
              examples:
                twoApps: { $ref: "#/components/examples/RecordingDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/recordings/{recording_id}/events:
    parameters: [{ $ref: "#/components/parameters/RecordingId" }]
    get:
      tags: [recordings]
      operationId: listRecordingEvents
      summary: A recording's events, paginated and searchable
      description: |
        A reviewer of the recording. In recording order (`seq`). Paginated (default `limit` 100).
        `q` matches the action, key, control, label, screen, source and time (case-insensitive,
        every word must match); `source` is one application (an event's `source`); `screen` is one
        screen (empty: the events with no screen). `sources` counts the events per source of the whole
        recording; `screens` counts the events per screen of the chosen source (or of all), in the order
        the recording first reached each screen. With `ids=true` the answer also lists the
        `event_id` of every matching event (all pages), for "select every match".
      x-twinlab-role: recording reviewer
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { $ref: "#/components/parameters/Offset" }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: source, in: query, schema: { type: string, maxLength: 500 } }
        - { name: screen, in: query, schema: { type: string, maxLength: 500 } }
        - { name: ids, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordingEvents" }
              examples:
                events: { $ref: "#/components/examples/RecordingEvents" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/recordings/{recording_id}/packages/download:
    parameters: [{ $ref: "#/components/parameters/RecordingId" }]
    get:
      tags: [recordings]
      operationId: downloadRecordingPackages
      summary: Download the packages of every application a recording holds
      description: |
        A reviewer of the recording (restricted evidence: else 403 `restricted`). One ZIP: `manifest.json`
        (format `twinlab2-recording-export/1`) and, per application of the recording the caller is a
        builder or owner of, its latest builder-approved package as `<app slug>/<app slug>-rev<N>-<revision12>.zip`.
        The other applications are listed in the manifest only (`not_available` or `no_package`): an admin
        flag gives nothing extra. Each included package is checked against its approved SHA-256 (500 if
        the stored bytes differ) and audited as `package.download`.
      x-twinlab-role: recording reviewer (packages only of the applications the caller builds)
      responses:
        "200": { $ref: "#/components/responses/Zip" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/recordings/{recording_id}/assignments/{app_id}:
    parameters:
      - { $ref: "#/components/parameters/RecordingId" }
      - { $ref: "#/components/parameters/AppId" }
    get:
      tags: [recordings]
      operationId: getAssignment
      summary: The events of this recording assigned to an application
      description: Owner of the application, and a reviewer of the recording.
      x-twinlab-role: owner
      responses:
        "200":
          description: "The assignment (`saved: false` when there is none yet)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assignment" }
              examples:
                assignment: { $ref: "#/components/examples/Assignment" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [recordings]
      operationId: saveAssignment
      summary: Save the owner's review of the assignment
      description: |
        Owner. Events are chosen by `event_id` (their `seq` is a display order and may change).
        Saving marks the link reviewed and clears the suggestions. Audited as `evidence.review`.
        With `expected_revision` (or `If-Match`) a stale save is refused with 409 `conflict` and
        the current assignment (see Conditional updates). Saving after a removal assigns the
        recording again. To assign no events, remove the assignment (DELETE).
      x-twinlab-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignmentInput" }
            examples:
              save: { value: { events: [0b1c2d3e-0000-4000-8000-000000000001, 0b1c2d3e-0000-4000-8000-000000000002], notes: Invoice is created from the saved order., expected_revision: 2 } }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assignment" }
              examples:
                assignment: { $ref: "#/components/examples/Assignment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [recordings]
      operationId: removeAssignment
      summary: Remove this application's assignment from the recording
      description: |
        Owner. The application no longer uses any event or note of this recording: its next draft
        package leaves the recording out, and frozen packages are unchanged. A later send of the
        same recording does not select its events again; saving an assignment again does.
        Answers the assignment with `removed: true`. Audited as `evidence.remove` with the event_ids
        that were selected. With `expected_revision` (query) or `If-Match`, a stale removal is
        refused with 409 `conflict`.
      x-twinlab-role: owner
      parameters: [{ $ref: "#/components/parameters/ExpectedRevision" }]
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assignment" }
              examples:
                removed: { $ref: "#/components/examples/AssignmentRemoved" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/recordings/{recording_id}/completeness/accept:
    parameters: [{ $ref: "#/components/parameters/RecordingId" }]
    post:
      tags: [recordings]
      operationId: acceptRecording
      summary: Accept a partial or failed recording as it is
      description: A reviewer of the recording. Audited as `recording.accept`.
      x-twinlab-role: recording reviewer
      responses:
        "200":
          description: The recording after accepting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordingDetail" }
              examples:
                twoApps: { $ref: "#/components/examples/RecordingDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------------------------------------
  # capture sessions (Request a recording)
  # ---------------------------------------------------------------------------------------------
  /api/v1/recordings/{recording_id}/workboard:
    parameters: [{ $ref: "#/components/parameters/RecordingId" }]
    get:
      tags: [recordings]
      operationId: getRecordingWorkboard
      summary: A recording's workboard
      description: |
        One row per application the recording holds: its identity (surface, host and path or
        program file), scope decision, steps in this recording, events selected and reviewed,
        scenarios, package state with readiness (blockers and warnings of `pack_validator`: of the
        current draft for an owner, of the latest frozen revision for a builder), build session and
        release, and **one** next action. Fields a caller's role does not cover are null (restricted
        evidence stays with owners). Also the timeline as one swim lane per application over the
        recording's time axis, the hosts several applications share (told apart by the longest
        path prefix), and the link to download every approved package of the recording.
      x-twinlab-role: recording reviewer
      responses:
        "200":
          description: The workboard.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workboard" }
              examples:
                twoApps: { $ref: "#/components/examples/Workboard" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/triage:
    get:
      tags: [apps]
      operationId: getTriage
      summary: Scope triage
      description: |
        The applications the caller owns that wait for a scope decision (status `discovered`), one
        card each: identity, surface, steps, sample screens and controls, and up to three ranked
        "looks like" suggestions (same host, same or similar name, same vendor, similar program
        file). With `recording_id` (a reviewer of it): that recording's applications; with
        `status=all` the decided ones too, to change a decision. `same_as` lists the applications
        the caller owns (to merge into); `labels` is the one mapping of scope statuses to the words
        the pages use.
      x-twinlab-role: signed-in (owner of each card's application)
      parameters:
        - { name: recording_id, in: query, schema: { type: string, maxLength: 120 } }
        - { name: status, in: query, schema: { type: string, enum: [discovered, all] } }
      responses:
        "200":
          description: The triage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Triage" }
              examples:
                outlook: { $ref: "#/components/examples/Triage" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/triage/decisions:
    post:
      tags: [apps]
      operationId: decideScope
      summary: Decide the scope of one or many applications
      description: |
        `replicate` (status `known`) or `not_replicated` (recorded as used only), for each listed
        application, all or none; each needs the owner role (else 403). With `expected_revision`, a
        change since then answers 409 `conflict`. Reversible: deciding again changes it back.
        "Same as" is a merge (preview, then confirm: the merge operations), never a bulk decision.
      x-twinlab-role: owner of each application
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TriageDecisions" }
            examples:
              two: { value: { decisions: [{ app_id: 9, decision: replicate }, { app_id: 13, decision: not_replicated }] } }
      responses:
        "200":
          description: Decided.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriageOutcome" }
              examples:
                decided:
                  value:
                    apps: [{ id: 3, name: Outlook, status: not_replicated, status_label: Not replicated (used only), previous: discovered }]
                    message: "Outlook: not replicated (later recordings note it only as used). You can reverse this at any time from the triage."
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/apps/{app_id}/access-requests:
    parameters: [{ $ref: "#/components/parameters/AppId" }]
    post:
      tags: [access]
      operationId: requestAccess
      summary: Ask an application's owners for a role
      description: |
        Any signed-in user, typically after a 403 `role` on the application (its `app_id` and
        `requested_role` are in that problem). Needs a role and a reason. One pending request per
        person and application: asking again replaces its role and reason. The answer is the same
        202 whether or not the application exists (a 403 hides that; so does this). Audited as
        `access.request`. 400 when the caller already holds that role or a higher one.
      x-twinlab-role: signed-in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessRequestInput" }
            examples:
              builder: { value: { role: builder, reason: "I am rebuilding Billing for the demo week." } }
      responses:
        "202":
          description: Sent to the owners (or nothing to send to; the caller cannot tell).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessRequestSent" }
              examples:
                sent:
                  value: { state: pending, role: builder, message: "Your request was sent to the application's owners. You will see their answer on your home page." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/access-requests:
    get:
      tags: [access]
      operationId: listAccessRequests
      summary: My access requests, and the ones I decide
      description: |
        `mine`: the caller's own requests, newest first (at most 50), with their outcome; `app_name`
        is null where the caller cannot see the application (a declined request, say).
        `to_decide`: pending requests on applications the caller owns (a portal admin: all of them).
      x-twinlab-role: signed-in
      responses:
        "200":
          description: The requests.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessRequestList" }
              examples:
                owner:
                  value:
                    mine: []
                    to_decide:
                      - { id: 4, app_id: 1, app_name: Billing, user: bob, role: builder, reason: "Rebuilding Billing.", state: pending, created_at: "2026-11-21T09:00:00+00:00", decided_by: null, decided_at: null, note: "" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/access-requests/{request_id}/decision:
    parameters:
      - name: request_id
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [access]
      operationId: decideAccessRequest
      summary: Approve or decline an access request
      description: |
        The application's owners and portal admins. `approve` assigns the requested role (or
        `role`, when given) as the access table does (`role.assign`), unless the person holds that
        role or a higher one by now; `decline` assigns nothing. `note` is shown to the requester.
        Audited as `access.approve` / `access.decline`. 409 `state_conflict` once decided; 404 for
        a request the caller neither made nor decides.
      x-twinlab-role: owner-or-admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessDecision" }
            examples:
              approve: { value: { decision: approve } }
              decline: { value: { decision: decline, note: "Ask again when the package is frozen." } }
      responses:
        "200":
          description: The decided request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessRequest" }
              examples:
                approved:
                  value: { id: 4, app_id: 1, app_name: Billing, user: bob, role: builder, reason: "Rebuilding Billing.", state: approved, created_at: "2026-11-21T09:00:00+00:00", decided_by: olivia, decided_at: "2026-11-21T09:05:00+00:00", note: "" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/home:
    get:
      tags: [session]
      operationId: getHome
      summary: The signed-in user's home
      description: |
        What the caller's role needs first. `role` is the highest role held anywhere (`admin` for a
        portal admin, `none` without any role). `published`: the visible applications' latest
        published release (what a viewer opens). `ready_to_build`: applications the caller builds
        that have a frozen package, with the latest build session and release; `waiting`: build
        sessions with questions or tool approvals waiting for an answer. `workboards`: the
        recordings the caller reviews (newest first, at most 20), with how many applications wait
        for a scope decision; `triage_count`: all applications the caller owns that wait for one.
      x-twinlab-role: signed-in
      responses:
        "200":
          description: The home.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Home" }
              examples:
                owner: { $ref: "#/components/examples/HomeOwner" }
                builder: { $ref: "#/components/examples/HomeBuilder" }
                viewer: { $ref: "#/components/examples/HomeViewer" }
                admin: { $ref: "#/components/examples/HomeAdmin" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/capture-sessions:
    get:
      tags: [capture]
      operationId: listCaptureSessions
      summary: Requested and recorded sessions, and what a new request can choose
      description: |
        Signed in. Sessions the caller requested (all for an admin); the caller's paired machines;
        applications the caller owns (with how many identities each has: a target needs one).
      x-twinlab-role: signed-in
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapturePage" }
              examples:
                page: { $ref: "#/components/examples/CapturePage" }
    post:
      tags: [capture]
      operationId: requestRecording
      x-twinlab-idempotent: stored
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Request a recording on a paired machine
      description: Signed in, owner of every target application. Each target needs an identity.
      x-twinlab-role: owner of every target
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewCaptureSession" }
            examples:
              two: { value: { name: Order to invoice, machine_id: 2, automation_id: 1, targets: [{ app_id: 1, level: full }, { app_id: 2, level: steps }] } }
      responses:
        "201":
          description: Offered to the machine.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaptureSession" }
              examples:
                session: { $ref: "#/components/examples/CaptureSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/capture-sessions/{session_id}/withdraw:
    parameters:
      - { name: session_id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [capture]
      operationId: withdrawCaptureSession
      summary: Withdraw a request not yet recorded
      description: Who requested it, or a portal admin.
      x-twinlab-role: requester-or-admin
      responses:
        "200":
          description: Withdrawn.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaptureSession" }
              examples:
                session: { $ref: "#/components/examples/CaptureSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------------------------------------
  # machines
  # ---------------------------------------------------------------------------------------------
  /api/v1/machines:
    get:
      tags: [machines]
      operationId: listMachines
      summary: Paired machines
      description: Signed in. The machines the caller paired; an admin sees all.
      x-twinlab-role: signed-in
      responses:
        "200":
          description: The machines.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MachineList" }
              examples:
                machines: { $ref: "#/components/examples/MachineList" }

  /api/v1/machines/pairing-codes:
    post:
      tags: [machines]
      operationId: makePairingCode
      x-twinlab-idempotent: stored
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Make a pairing code
      description: |
        Signed in. The code works once, within `minutes`, and is never shown again. `scopes`: what
        the machine paired with it may do (default both): `record` (sessions offered, applications,
        a recording's references) and `upload` (evidence uploads). See docs/AGENT-API-SECURITY.md.
      x-twinlab-role: signed-in
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PairingCodeInput" }
            examples:
              upload_only: { value: { scopes: [upload] } }
      responses:
        "201":
          description: The code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairingCode" }
              examples:
                code: { value: { code: ABCDE23456, display: ABCDE-23456, minutes: 10, expires_at: "2026-11-20T10:10:00+00:00", scopes: [record, upload] } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/machines/{machine_id}/revoke:
    parameters:
      - { name: machine_id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [machines]
      operationId: revokeMachine
      summary: Revoke a machine
      description: Who paired it, or a portal admin.
      x-twinlab-role: pairer-or-admin
      responses:
        "200":
          description: The machine.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Machine" }
              examples:
                revoked: { value: { id: 3, name: OLD-PC, paired_by: ana, paired_at: "2026-09-01T09:00:00+00:00", last_seen: null, recorder: "", contract_version: null, revoked_at: "2026-11-20T10:00:00+00:00", scopes: [record, upload] } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------------------------------------
  # automations
  # ---------------------------------------------------------------------------------------------
  /api/v1/automations:
    get:
      tags: [automations]
      operationId: listAutomations
      summary: Automations, and the applications a new one can link
      x-twinlab-role: signed-in
      responses:
        "200":
          description: The automations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationPage" }
              examples:
                page: { $ref: "#/components/examples/AutomationPage" }
    post:
      tags: [automations]
      operationId: saveAutomation
      x-twinlab-idempotent: stored
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Add (or update by name) an automation
      description: Signed in; linking an application needs its owner role.
      x-twinlab-role: owner of every linked application
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewAutomation" }
            examples:
              bot: { value: { name: UiPath order to invoice, kind: uipath, notes: "", apps: [1, 2] } }
      responses:
        "201":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationDetail" }
              examples:
                detail: { $ref: "#/components/examples/AutomationDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/automations/import:
    post:
      tags: [automations]
      operationId: importAutomation
      summary: Import an automation file (automation.yaml)
      description: Links only the applications (by name) the caller owns; unmatched names go to the notes.
      x-twinlab-role: signed-in
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, contentMediaType: application/yaml, description: "automation.yaml, at most 256 KiB" }
      responses:
        "201":
          description: Imported.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationDetail" }
              examples:
                detail: { $ref: "#/components/examples/AutomationDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/automations/{automation_id}:
    parameters:
      - { name: automation_id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [automations]
      operationId: getAutomation
      summary: One automation
      description: Its applications the caller can view, and its recordings the caller may open.
      x-twinlab-role: signed-in
      responses:
        "200":
          description: The automation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationDetail" }
              examples:
                detail: { $ref: "#/components/examples/AutomationDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------------------------------------
  # releases
  # ---------------------------------------------------------------------------------------------
  /api/v1/releases/{release_id}:
    parameters: [{ $ref: "#/components/parameters/ReleaseId" }]
    get:
      tags: [releases]
      operationId: getRelease
      summary: One release
      description: Viewer of its application.
      x-twinlab-role: viewer
      responses:
        "200":
          description: The release.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseDetail" }
              examples:
                tested: { $ref: "#/components/examples/ReleaseDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/releases/{release_id}/deployments:
    parameters: [{ $ref: "#/components/parameters/ReleaseId" }]
    put:
      tags: [releases]
      operationId: saveDeployment
      summary: Register (or change) a deployment by environment, and check its version
      description: Owner. HTTP or HTTPS URL without credentials. Audited as `deployment.register`.
      x-twinlab-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeploymentInput" }
            examples:
              demo: { value: { environment: OpenShift demo, url: https://billing-demo.apps.example.test, username: demo, secret_ref: vault:demo/billing } }
      responses:
        "200": { $ref: "#/components/responses/ReleaseDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/releases/{release_id}/deployments/check:
    parameters: [{ $ref: "#/components/parameters/ReleaseId" }]
    post:
      tags: [releases]
      operationId: checkDeployment
      summary: Check a deployment's version again
      x-twinlab-role: builder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeploymentCheck" }
            examples:
              demo: { value: { environment: OpenShift demo } }
      responses:
        "200": { $ref: "#/components/responses/ReleaseDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/releases/{release_id}/tests:
    parameters: [{ $ref: "#/components/parameters/ReleaseId" }]
    post:
      tags: [releases]
      operationId: recordTest
      summary: Record test results (makes the release Tested when everything holds)
      description: Owner. The commit's checks are fetched first and kept even when the test is refused (400). Audited as `release.test`.
      x-twinlab-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestInput" }
            examples:
              pass: { value: { commit: 3f9a1c2d4e5b6a7980a1b2c3d4e5f60718293a4b, platform: "Windows 11, Python 3.13", launch: python app.py, reset_result: pass, reset_notes: "", results: { s1: pass, s2: pass } } }
      responses:
        "200": { $ref: "#/components/responses/ReleaseDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/releases/{release_id}/checks/refresh:
    parameters: [{ $ref: "#/components/parameters/ReleaseId" }]
    post:
      tags: [releases]
      operationId: refreshChecks
      summary: Check GitHub again
      x-twinlab-role: owner
      responses:
        "200": { $ref: "#/components/responses/ReleaseDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/releases/{release_id}/verify:
    parameters: [{ $ref: "#/components/parameters/ReleaseId" }]
    post:
      tags: [releases]
      operationId: verifyRelease
      x-twinlab-idempotent: native
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Verify this build
      description: >-
        Owner. Queues the verification and answers 202 with it (poll `GET /api/v1/verifications/{id}`):
        the worker reads the checks, runs the scenario replay on each of the application's surfaces (web,
        mainframe, desktop), the business-outcome and reset checks, and stores the report. Idempotent by
        `Idempotency-Key` (or its alias `request_key`: one verification per key); without one, a request while a verification of the release is queued or running gets
        that one. Audited as `release.verify` (and `release.verified` when it ends).
      x-twinlab-role: owner
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyInput" }
            examples:
              mainframe: { value: { request_key: verify-5-1, targets: { mainframe: "tn3270://account-inquiry.apps.example.test:3270" } } }
      responses:
        "202": { $ref: "#/components/responses/Verification" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/verifications/{verification_id}:
    parameters: [{ name: verification_id, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [releases]
      operationId: getVerification
      summary: One verification (Verify as a job)
      description: Viewer of its application. Poll while `state` is queued or running.
      x-twinlab-role: viewer
      responses:
        "200": { $ref: "#/components/responses/Verification" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/releases/{release_id}/publish:
    parameters: [{ $ref: "#/components/parameters/ReleaseId" }]
    post:
      tags: [releases]
      operationId: publishRelease
      summary: Publish a Tested release
      description: Owner. One publish at a time per application (409). Only a Tested release (400). Audited as `release.publish`.
      x-twinlab-role: owner
      responses:
        "200": { $ref: "#/components/responses/ReleaseDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/releases/{release_id}/reports/{report_id}:
    parameters:
      - { $ref: "#/components/parameters/ReleaseId" }
      - { name: report_id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [releases]
      operationId: downloadVerificationReport
      summary: Download a verification report (JSON)
      x-twinlab-role: builder
      responses:
        "200":
          description: The report as a JSON attachment.
          content:
            application/json:
              schema: { type: object }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/releases/{release_id}/download:
    parameters: [{ $ref: "#/components/parameters/ReleaseId" }]
    get:
      tags: [releases]
      operationId: downloadRelease
      summary: Download the release ZIP
      description: A published release for every viewer; one not yet published for builders and owners.
      x-twinlab-role: viewer (builder before publishing)
      responses:
        "200": { $ref: "#/components/responses/Zip" }
        "302": { $ref: "#/components/responses/Presigned" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/releases/{release_id}/openshift.yaml:
    parameters: [{ $ref: "#/components/parameters/ReleaseId" }]
    get:
      tags: [releases]
      operationId: getReleaseManifest
      summary: Download the release's OpenShift manifest
      description: |
        Pinned to what was verified: the BuildConfig builds exactly the release's commit (git ref =
        the commit SHA) into the tag `<name>:<commit>`, nothing follows a branch or `:latest`, and
        the Deployment runs the built image by digest (`<name>@sha256:...`). Without `image_digest`
        the digest is a placeholder and the file's header says how to read it after the build. The
        builder package's `deploy/ocp/<name>/openshift.yaml` is the development manifest (builds
        `main`, follows `:latest`). 404 for a desktop demo.
      x-twinlab-role: viewer (builder before publishing)
      parameters:
        - name: image_digest
          in: query
          required: false
          schema: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
          description: The built image's digest (`oc get istag <name>:<commit>`).
      responses:
        "200":
          description: The release manifest (a Kubernetes List).
          content:
            application/yaml:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------------------------------------
  # setup
  # ---------------------------------------------------------------------------------------------
  /api/v1/setup:
    get:
      tags: [setup]
      operationId: getSetup
      summary: Setup / Advanced
      description: Signed in. The applications the caller owns, and the artifact storage (never credentials).
      x-twinlab-role: signed-in
      responses:
        "200":
          description: The setup page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupPage" }
              examples:
                setup: { value: { apps: [{ id: 1, name: Billing Desk }, { id: 2, name: CaseDesk }], storage: { backend: filesystem, location: .state/artifacts, encrypted: false } } }

  /api/v1/setup/builds:
    get:
      tags: [setup]
      operationId: getBuildSetup
      summary: Build sessions setup
      description: Portal admins. Keys and tokens are never returned, only whether they are set and where from.
      x-twinlab-role: admin
      responses:
        "200":
          description: The build setup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildSetup" }
              examples:
                setup: { $ref: "#/components/examples/BuildSetup" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/setup/builds/settings:
    put:
      tags: [setup]
      operationId: saveBuildSettings
      summary: Save build settings
      description: |
        Portal admins. Only the keys sent change. An empty secret keeps the saved secret unless its
        key is listed in `clear`. An environment variable wins over a saved value.
      x-twinlab-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuildSettingsInput" }
            examples:
              claude: { value: { settings: { CLAUDE_MODEL: claude-opus-5-5, DEFAULT_CLAUDE_BUDGET_USD: "20" }, clear: [] } }
      responses:
        "200":
          description: The build setup after saving.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildSetup" }
              examples:
                setup: { $ref: "#/components/examples/BuildSetup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/setup/builds/check:
    post:
      tags: [setup]
      operationId: checkConnections
      summary: Check Devin and GitHub
      x-twinlab-role: admin
      responses:
        "200":
          description: One result per service.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionCheck" }
              examples:
                check: { value: { results: [{ service: devin, ok: false, message: "Devin is not configured: an admin sets the API key and organisation under Setup." }, { service: github, ok: true, message: "GitHub: the token works for every connected repository." }] } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/setup/builds/repos:
    post:
      tags: [setup]
      operationId: connectRepository
      summary: Connect a GitHub repository
      x-twinlab-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo]
              properties:
                repo: { type: string, description: "owner/name" }
            examples:
              repo: { value: { repo: example/billing-desk-demo } }
      responses:
        "201":
          description: Connected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repo" }
              examples:
                repo: { value: { repo: example/billing-desk-demo, default_branch: main, private: true, connected_by: root } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [setup]
      operationId: disconnectRepository
      summary: Disconnect a GitHub repository
      x-twinlab-role: admin
      parameters:
        - { name: repo, in: query, required: true, schema: { type: string }, description: "owner/name" }
      responses:
        "204": { description: "Disconnected." }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/setup/builds/worker:
    post:
      tags: [setup]
      operationId: startWorker
      summary: Start a build worker (development only)
      description: Portal admins, and only when the development worker is allowed (else 403).
      x-twinlab-role: admin
      responses:
        "200":
          description: The worker.
          content:
            application/json:
              schema:
                type: object
                required: [pid, started]
                properties:
                  pid: { type: integer }
                  started: { type: boolean, description: "false when one was already running" }
              examples:
                started: { value: { pid: 4242, started: true } }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------------------------------------
  # users
  # ---------------------------------------------------------------------------------------------
  /api/v1/admin/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: Local users and portal admins
      x-twinlab-role: admin
      responses:
        "200":
          description: The users.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
              examples:
                users: { $ref: "#/components/examples/UserList" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/users/{user_name}:
    parameters:
      - { name: user_name, in: path, required: true, schema: { type: string, maxLength: 120 } }
    put:
      tags: [users]
      operationId: saveUser
      summary: Add or change a local user
      description: Portal admins. An omitted or empty password keeps the saved one. Audited as `user.save`.
      x-twinlab-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
            examples:
              ben: { value: { password: "", is_admin: false } }
      responses:
        "200":
          description: The users after saving.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
              examples:
                users: { $ref: "#/components/examples/UserList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------------------------------------
  # operations (admins): retention, deletion, purges, tombstones, audit export
  # ---------------------------------------------------------------------------------------------
  /api/v1/admin/operations:
    get:
      tags: [operations]
      operationId: getOperations
      summary: Storage, encryption, metrics, tracing and retention at a glance
      description: Portal admins. What the Operations page shows; what a retention run would delete now (`plan`).
      x-twinlab-role: admin
      responses:
        "200":
          description: The operations summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operations" }
              examples:
                local: { $ref: "#/components/examples/Operations" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/retention:
    put:
      tags: [operations]
      operationId: saveRetentionPolicy
      summary: Set the retention policy
      description: |
        Portal admins. Days to keep each kind (`null` keeps it forever; audit at least 30).
        `schedule: daily` queues a retention run every 24 hours. Audited as `retention.policy`.
      x-twinlab-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetentionPolicyInput" }
            examples:
              year: { value: { raw_recordings: 90, evidence: 365, frozen_packages: 365, build_logs: 180, audit: null, schedule: daily } }
      responses:
        "200":
          description: The policy now in force.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionPolicy" }
              examples:
                year: { value: { raw_recordings: 90, evidence: 365, frozen_packages: 365, build_logs: 180, audit: null, schedule: daily, updated_by: root, updated_at: "2026-11-21T09:00:00+00:00" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/retention/runs:
    post:
      tags: [operations]
      operationId: startRetentionRun
      summary: Run the retention policy (or a dry run) as a worker job
      description: |
        Portal admins. A dry run (the default) counts what would be deleted; a real run deletes it,
        writes a tombstone per deleted object and an audit row `retention.apply`. Poll the run.
      x-twinlab-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetentionRunInput" }
            examples:
              dry: { value: { dry_run: true } }
      responses:
        "202":
          description: The run, queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionRun" }
              examples:
                queued: { value: { id: 3, requested_by: root, dry_run: true, state: queued, policy: { raw_recordings: 90, evidence: null, frozen_packages: null, build_logs: null, audit: null, schedule: off }, result: null, error: null, created_at: "2026-11-21T09:00:00+00:00", finished_at: null } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/retention/runs/{run_id}:
    parameters:
      - { name: run_id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [operations]
      operationId: getRetentionRun
      summary: A retention run and its result
      x-twinlab-role: admin
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionRun" }
              examples:
                done: { $ref: "#/components/examples/RetentionRunDone" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/audit-export:
    get:
      tags: [operations, audit]
      operationId: exportAudit
      summary: Export the audit history (CSV or JSON lines), filtered by date
      description: |
        Portal admins. Rows with `since` <= `at` < `until` (ISO dates or times, UTC), oldest first,
        optionally of one application. CSV cells that a spreadsheet would run as a formula are
        prefixed with `'`. Audited as `audit.export`.
      x-twinlab-role: admin
      parameters:
        - { name: since, in: query, schema: { type: string, maxLength: 40 }, description: "e.g. 2026-11-01" }
        - { name: until, in: query, schema: { type: string, maxLength: 40 }, description: "e.g. 2026-12-01 (exclusive)" }
        - { name: app_id, in: query, schema: { type: integer } }
        - { name: format, in: query, schema: { type: string, enum: [csv, json], default: csv } }
      responses:
        "200":
          description: The rows, as an attachment.
          content:
            text/csv:
              schema: { type: string }
            application/x-ndjson:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/tombstones:
    get:
      tags: [operations]
      operationId: listTombstones
      summary: What was deleted, newest first
      x-twinlab-role: admin
      parameters:
        - { name: app_id, in: query, schema: { type: integer } }
        - { name: recording_id, in: query, schema: { type: string, maxLength: 128 } }
      responses:
        "200":
          description: The tombstones.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TombstoneList" }
              examples:
                some: { $ref: "#/components/examples/TombstoneList" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/files/{sha256}:
    parameters:
      - { name: sha256, in: path, required: true, schema: { $ref: "#/components/schemas/Sha256" } }
    get:
      tags: [operations]
      operationId: findFile
      summary: Where a file is stored, by its SHA-256
      description: |
        Portal admins. The artifacts that are this file, and the stored ZIPs (frozen packages,
        release downloads, reports, recording bundles) that contain it. A purge deletes all of them.
      x-twinlab-role: admin
      responses:
        "200":
          description: Where it is.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileLocations" }
              examples:
                found: { $ref: "#/components/examples/FileLocations" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/files/{sha256}/purge:
    parameters:
      - { name: sha256, in: path, required: true, schema: { $ref: "#/components/schemas/Sha256" } }
    post:
      tags: [operations]
      operationId: purgeFile
      summary: Delete every stored copy of a file (a leaked picture)
      description: |
        Portal admins. Deletes the artifacts that are this file (on S3 every version of its key),
        the attachments that point at them, and every stored ZIP that contains it, whole. Writes
        tombstones and an audit row `purge`. Backups keep their copies until they expire: see
        docs/operations/leaked-picture.md.
      x-twinlab-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurgeInput" }
            examples:
              leak: { value: { note: "Screenshot showed a customer's card number (INC-1234)." } }
      responses:
        "200":
          description: What was deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurgeResult" }
              examples:
                purged: { value: { sha256: 5d41402abc4b2a76b9719d911017c592ae0f1f7a2b6c1d0e9f8a7b6c5d4e3f2a, tombstone_id: 9, artifacts_deleted: 1, containers_deleted: [{ id: 14, kind: builder_package, members: [evidence/screens/login.png] }], other_versions_deleted: 1, freed_bytes: 48213 } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/apps/{app_id}/tombstones:
    parameters: [{ $ref: "#/components/parameters/AppId" }]
    get:
      tags: [operations, releases]
      operationId: getAppTombstones
      summary: What was deleted from this application (retention, owner requests, purges)
      description: Viewers of the application. Shown on its release pages, so a release still says what was deleted.
      x-twinlab-role: viewer
      responses:
        "200":
          description: The tombstones.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TombstoneList" }
              examples:
                some: { $ref: "#/components/examples/TombstoneList" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/recordings/{recording_id}/deletion:
    parameters: [{ $ref: "#/components/parameters/RecordingId" }]
    post:
      tags: [recordings, operations]
      operationId: deleteRecording
      summary: Delete a recording and its derived data (owner's request)
      description: |
        The owners of every application the recording covers, or a portal admin. Deletes its steps,
        assignments and evidence links, its uploaded bundles' bytes and, with `purge_packages`, the
        frozen packages that include it. A tombstone per deleted object stays; audited as
        `recording.delete`.
      x-twinlab-role: owner of every application the recording covers, or admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordingDeletionInput" }
            examples:
              request: { value: { reason: "Recorded on the production tenant by mistake.", purge_packages: true } }
      responses:
        "200":
          description: What was deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordingDeletion" }
              examples:
                deleted: { value: { recording_id: 9f2c4e1a7b3d5f60, tombstone_id: 4, apps: [1], uploads_deleted: 1, packages_deleted: [{ app_id: 1, rev: 2 }], freed_bytes: 120034 } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------------------------------------
  # recorder agent API (RECORDER-CONTRACT.md). Token scopes and the per-machine rate limit
  # (403 {error, scope}, 429 {error, retry_after} with Retry-After): docs/AGENT-API-SECURITY.md
  # ---------------------------------------------------------------------------------------------
  /api/agent/pair:
    post:
      tags: [agent]
      operationId: agentPair
      summary: Pair a recorder with a pairing code
      description: No token yet; the pairing code is the credential. 403 wrong, used or expired code; 429 after too many wrong codes; 426 outdated recorder contract.
      x-twinlab-role: public (pairing code)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentMessage" }
      responses:
        "200": { $ref: "#/components/responses/AgentJson" }
        "400": { $ref: "#/components/responses/AgentError" }
        "403": { $ref: "#/components/responses/AgentError" }
        "426": { $ref: "#/components/responses/AgentError" }
        "429": { $ref: "#/components/responses/AgentError" }
  /api/agent/sessions:
    get:
      tags: [agent]
      operationId: agentSessions
      summary: Sessions offered to this machine, and the keys not to record in full
      description: Scope `record`.
      x-twinlab-role: agent-token
      security: [{ agentToken: [] }]
      responses:
        "200": { $ref: "#/components/responses/AgentJson" }
        "401": { $ref: "#/components/responses/AgentError" }
        "403": { $ref: "#/components/responses/AgentError" }
        "429": { $ref: "#/components/responses/AgentError" }
  /api/agent/apps:
    get:
      tags: [agent]
      operationId: agentApps
      summary: Catalog applications with an identity, for a session started on the recorder
      description: Scope `record`.
      x-twinlab-role: agent-token
      security: [{ agentToken: [] }]
      responses:
        "200": { $ref: "#/components/responses/AgentJson" }
        "401": { $ref: "#/components/responses/AgentError" }
        "403": { $ref: "#/components/responses/AgentError" }
        "429": { $ref: "#/components/responses/AgentError" }
  /api/agent/update:
    get:
      tags: [agent]
      operationId: agentUpdate
      summary: The newest recorder version this portal offers, for a recorder to update itself
      description: >-
        Any scope (every paired machine may update itself).
        The release an administrator put in the portal's releases folder (`TWINLAB2_RECORDER_RELEASES`,
        docs/recorder-deployment.md). `update_available` compares it with the recorder's `version`.
        The recorder downloads `latest.url`, checks `size` and `sha256`, then the file's Authenticode
        signature against its machine policy, and installs only while nothing is being recorded.
      x-twinlab-role: agent-token
      security: [{ agentToken: [] }]
      parameters:
        - { name: version, in: query, required: false, schema: { type: string }, description: The recorder's version. }
      responses:
        "200":
          description: The newest release, or none.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecorderUpdate" }
        "401": { $ref: "#/components/responses/AgentError" }
        "429": { $ref: "#/components/responses/AgentError" }
  /api/agent/update/{file}:
    parameters:
      - { name: file, in: path, required: true, schema: { type: string } }
    get:
      tags: [agent]
      operationId: agentUpdateFile
      summary: Download the offered recorder release (the MSI)
      x-twinlab-role: agent-token
      security: [{ agentToken: [] }]
      responses:
        "200":
          description: The MSI.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/AgentError" }
        "404": { $ref: "#/components/responses/AgentError" }
        "429": { $ref: "#/components/responses/AgentError" }
  /api/agent/references:
    post:
      tags: [agent]
      operationId: agentReferences
      summary: The references of a finished recording (applications, steps, timeline, completeness)
      description: Scope `record`.
      x-twinlab-role: agent-token
      security: [{ agentToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentMessage" }
      responses:
        "200": { $ref: "#/components/responses/AgentJson" }
        "400": { $ref: "#/components/responses/AgentError" }
        "401": { $ref: "#/components/responses/AgentError" }
        "403": { $ref: "#/components/responses/AgentError" }
        "429": { $ref: "#/components/responses/AgentError" }
        "409": { $ref: "#/components/responses/AgentError" }
        "426": { $ref: "#/components/responses/AgentError" }
  /api/uploads:
    post:
      tags: [agent]
      operationId: agentUploadInit
      summary: Start a resumable upload of a recording's evidence
      description: Scope `upload` (the upload's own token, then, for its chunks, parts and completion).
      x-twinlab-role: agent-token
      security: [{ agentToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentMessage" }
      responses:
        "200": { $ref: "#/components/responses/AgentJson" }
        "201": { $ref: "#/components/responses/AgentJson" }
        "400": { $ref: "#/components/responses/AgentError" }
        "401": { $ref: "#/components/responses/AgentError" }
        "403": { $ref: "#/components/responses/AgentError" }
        "429": { $ref: "#/components/responses/AgentError" }
  /api/uploads/{upload_id}:
    parameters:
      - { name: upload_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [agent]
      operationId: agentUploadStatus
      summary: An upload's status (the parts received)
      x-twinlab-role: agent-token (then the upload's own token)
      security: [{ agentToken: [] }]
      responses:
        "200": { $ref: "#/components/responses/AgentJson" }
        "401": { $ref: "#/components/responses/AgentError" }
        "403": { $ref: "#/components/responses/AgentError" }
        "429": { $ref: "#/components/responses/AgentError" }
        "404": { $ref: "#/components/responses/AgentError" }
    put:
      tags: [agent]
      operationId: agentUploadChunk
      summary: Send a chunk (Content-Range)
      x-twinlab-role: agent-token (then the upload's own token)
      security: [{ agentToken: [] }]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, contentMediaType: application/octet-stream }
      responses:
        "200": { $ref: "#/components/responses/AgentJson" }
        "400": { $ref: "#/components/responses/AgentError" }
        "401": { $ref: "#/components/responses/AgentError" }
        "403": { $ref: "#/components/responses/AgentError" }
        "429": { $ref: "#/components/responses/AgentError" }
        "409": { $ref: "#/components/responses/AgentError" }
  /api/uploads/{upload_id}/parts:
    parameters:
      - { name: upload_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [agent]
      operationId: agentUploadParts
      summary: Presigned part URLs (S3 artifact storage)
      x-twinlab-role: agent-token (then the upload's own token)
      security: [{ agentToken: [] }]
      responses:
        "200": { $ref: "#/components/responses/AgentJson" }
        "401": { $ref: "#/components/responses/AgentError" }
        "403": { $ref: "#/components/responses/AgentError" }
        "429": { $ref: "#/components/responses/AgentError" }
  /api/uploads/{upload_id}/complete:
    parameters:
      - { name: upload_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [agent]
      operationId: agentUploadComplete
      summary: Complete an upload (its SHA-256 is checked)
      x-twinlab-role: agent-token (then the upload's own token)
      security: [{ agentToken: [] }]
      responses:
        "200": { $ref: "#/components/responses/AgentJson" }
        "400": { $ref: "#/components/responses/AgentError" }
        "401": { $ref: "#/components/responses/AgentError" }
        "403": { $ref: "#/components/responses/AgentError" }
        "429": { $ref: "#/components/responses/AgentError" }
        "409": { $ref: "#/components/responses/AgentError" }
  /api/recordings/{recording_id}/upload:
    parameters: [{ $ref: "#/components/parameters/RecordingId" }]
    get:
      tags: [agent]
      operationId: recordingUploadProgress
      summary: A recording's upload progress (signed-in users; also in RecordingDetail.upload)
      x-twinlab-role: signed-in
      responses:
        "200": { $ref: "#/components/responses/AgentJson" }
        "404": { $ref: "#/components/responses/AgentError" }

components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: session
      description: |
        The portal's Flask session cookie, set by `POST /api/v1/session` or, behind the OAuth
        proxy, by the portal on the first request carrying `X-Forwarded-User`. Mutating requests
        also send `X-CSRF-Token` (see the description).
    agentToken:
      type: http
      scheme: bearer
      description: A recorder machine's token, from `POST /api/agent/pair`.

  parameters:
    AppId: { name: app_id, in: path, required: true, schema: { type: integer } }
    Rev: { name: rev, in: path, required: true, schema: { type: integer, minimum: 1 } }
    BuildId: { name: build_id, in: path, required: true, schema: { type: integer } }
    ReleaseId: { name: release_id, in: path, required: true, schema: { type: integer } }
    RecordingId: { name: recording_id, in: path, required: true, schema: { type: string } }
    Limit: { name: limit, in: query, description: "Page size (see Pagination).", schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    Offset: { name: offset, in: query, description: "Items to skip (see Pagination).", schema: { type: integer, minimum: 0, default: 0 } }
    ExpectedRevision: { name: expected_revision, in: query, description: "The revision the change was made from (see Conditional updates).", schema: { type: integer, minimum: 0 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, description: "One key per intended action (see Idempotency).", schema: { type: string, minLength: 1, maxLength: 255, pattern: "^[\\x21-\\x7e]+$" } }
    IfNoneMatch: { name: If-None-Match, in: header, description: "The `ETag` of the last answer (see Conditional GETs).", schema: { type: string } }

  headers:
    RequestId: { description: "The request's id (see Request ids).", schema: { type: string } }
    IdempotentReplayed: { description: "`true` when the answer is a replay of an earlier request with the same `Idempotency-Key`.", schema: { type: string, enum: ["true"] } }
    ETag: { description: "The answer's entity tag (see Conditional GETs).", schema: { type: string } }
    Deprecation: { description: "`true` when the answer carries a deprecated member (see Deprecations).", schema: { type: string } }

  responses:
    Gone:
      description: The stored file was deleted; its tombstone says when and why.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            gone:
              value: { type: /errors/gone, title: Gone, status: 410, detail: "This file was deleted on 2026-11-20T10:00:00+00:00 (retention).", code: gone, tombstone_id: 7 }
    BadRequest:
      description: The request is not acceptable; `detail` says why.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            scenario:
              value: { type: /errors/invalid_request, title: Bad Request, status: 400, detail: Add a business scenario before freezing a builder package., code: invalid_request }
    Unauthorized:
      description: Not signed in.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            signin:
              value: { type: /errors/signed_out, title: Unauthorized, status: 401, detail: Sign in first., code: signed_out, request_id: 3f9a1c0d5e7b2a64 }
    Forbidden:
      description: "The caller lacks the role (or the CSRF token is missing, `code: csrf`)."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            role:
              value: { type: /errors/role, title: Forbidden, status: 403, detail: "This needs the owner role on this application. Ask an owner (alice) for it.", code: role, owners: [alice] }
    NotFound:
      description: No such object.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            missing:
              value: { type: /errors/not_found, title: Not Found, status: 404, detail: Not found., code: not_found }
    Conflict:
      description: The request conflicts with the current state; `detail` says how.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            conflict:
              value: { type: /errors/state_conflict, title: Conflict, status: 409, detail: "Another application already has this identity: merge them instead.", code: state_conflict }
            stale:
              summary: A stale update (code conflict) with the current version
              value:
                type: /errors/conflict
                title: Conflict
                status: 409
                code: conflict
                detail: "Someone else changed this assignment since you opened it (now revision 3). Compare your changes with theirs, then keep yours or take theirs."
                current: { app_id: 1, recording_id: 9f2c4e1a7b3d5f60, saved: true, reviewed: true, removed: false, revision: 3, selected: [0b1c2d3e-0000-4000-8000-000000000001], suggested: [], notes: Theirs. }
    Zip:
      description: The ZIP file.
      content:
        application/zip:
          schema: { type: string, contentMediaType: application/zip }
    Presigned:
      description: A redirect to a short-lived presigned URL (S3 artifact storage).
      headers:
        Location: { schema: { type: string, format: uri } }
    BuildDetail:
      description: The session after the action (`notice` may say what happened).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BuildDetail" }
          examples:
            waiting: { $ref: "#/components/examples/BuildDetail" }
    ReleaseDetail:
      description: The release after the action.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ReleaseDetail" }
          examples:
            tested: { $ref: "#/components/examples/ReleaseDetail" }
    Verification:
      description: The verification (queued, running, or ended with its report).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Verification" }
          examples:
            running: { $ref: "#/components/examples/VerificationRunning" }
            passed: { $ref: "#/components/examples/VerificationPassed" }
    AgentJson:
      description: The agent API's JSON answer (RECORDER-CONTRACT.md).
      content:
        application/json:
          schema: { type: object }
    AgentError:
      description: The agent API's error `{error, ...}` (unchanged; not problem+json).
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }

  schemas:
    # -- common -----------------------------------------------------------------------------------
    RetentionDays:
      type: [integer, "null"]
      minimum: 1
      maximum: 36500
      description: Days to keep; null keeps it forever.
    RetentionPolicyInput:
      type: object
      properties:
        raw_recordings: { $ref: "#/components/schemas/RetentionDays" }
        evidence: { $ref: "#/components/schemas/RetentionDays" }
        frozen_packages: { $ref: "#/components/schemas/RetentionDays" }
        build_logs: { $ref: "#/components/schemas/RetentionDays" }
        audit: { $ref: "#/components/schemas/RetentionDays" }
        schedule: { type: string, enum: ["off", daily] }
    RetentionPolicy:
      type: object
      required: [raw_recordings, evidence, frozen_packages, build_logs, audit, schedule]
      properties:
        raw_recordings: { $ref: "#/components/schemas/RetentionDays" }
        evidence: { $ref: "#/components/schemas/RetentionDays" }
        frozen_packages: { $ref: "#/components/schemas/RetentionDays" }
        build_logs: { $ref: "#/components/schemas/RetentionDays" }
        audit: { $ref: "#/components/schemas/RetentionDays" }
        schedule: { type: string, enum: ["off", daily] }
        updated_by: { type: [string, "null"] }
        updated_at: { type: [string, "null"] }
    RetentionPlanItem:
      type: object
      required: [days, count, bytes]
      properties:
        days: { type: [integer, "null"] }
        count: { type: integer, description: "Objects (or rows, for build logs and audit) that go." }
        bytes: { type: integer }
        freed_bytes: { type: integer, description: "Stored bytes removed (a real run)." }
    RetentionPlan:
      type: object
      required: [raw_recordings, evidence, frozen_packages, build_logs, audit]
      properties:
        raw_recordings: { $ref: "#/components/schemas/RetentionPlanItem" }
        evidence: { $ref: "#/components/schemas/RetentionPlanItem" }
        frozen_packages: { $ref: "#/components/schemas/RetentionPlanItem" }
        build_logs: { $ref: "#/components/schemas/RetentionPlanItem" }
        audit: { $ref: "#/components/schemas/RetentionPlanItem" }
    RetentionRunInput:
      type: object
      properties:
        dry_run: { type: boolean, default: true }
    RetentionRun:
      type: object
      required: [id, requested_by, dry_run, state, policy, result, error, created_at, finished_at]
      properties:
        id: { type: integer }
        requested_by: { type: string }
        dry_run: { type: boolean }
        state: { type: string, enum: [queued, running, done, failed] }
        policy: { type: object, additionalProperties: true }
        result: { oneOf: [{ $ref: "#/components/schemas/RetentionPlan" }, { type: "null" }] }
        error: { type: [string, "null"] }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        finished_at: { type: [string, "null"] }
    Operations:
      type: object
      required: [storage, metrics, tracing, log_format, policy, plan, runs, queue]
      properties:
        storage: { type: object, additionalProperties: true, description: "The artifact store (backend, location or bucket, versioning, encryption)." }
        metrics:
          type: object
          required: [port, token]
          properties:
            port: { type: [integer, "null"], description: "The internal port /metrics answers on." }
            token: { type: boolean, description: "Whether a bearer token also opens /metrics on any port." }
        tracing: { type: boolean }
        log_format: { type: string, enum: [json, text] }
        policy: { $ref: "#/components/schemas/RetentionPolicy" }
        plan: { $ref: "#/components/schemas/RetentionPlan" }
        runs: { type: array, items: { $ref: "#/components/schemas/RetentionRun" } }
        queue: { type: object, additionalProperties: { type: integer }, description: "Jobs by state." }
    Tombstone:
      type: object
      required: [id, at, actor, reason, object_type, object_id, app_id, recording_id, sha256, size, details]
      properties:
        id: { type: integer }
        at: { $ref: "#/components/schemas/Timestamp" }
        actor: { type: string }
        reason: { type: string, enum: [retention, owner_request, purge] }
        object_type: { type: string, description: "recording, upload, attachment, frozen_package, build_messages, audit_log, file, …" }
        object_id: { type: string }
        app_id: { type: [integer, "null"] }
        recording_id: { type: [string, "null"] }
        sha256: { type: [string, "null"] }
        size: { type: [integer, "null"] }
        details: { type: object, additionalProperties: true }
    TombstoneList:
      type: object
      required: [tombstones]
      properties:
        tombstones: { type: array, items: { $ref: "#/components/schemas/Tombstone" } }
    FileLocations:
      type: object
      required: [sha256, artifacts, inside]
      properties:
        sha256: { $ref: "#/components/schemas/Sha256" }
        artifacts:
          type: array
          items:
            type: object
            required: [id, kind, app_id, size, created_at]
            properties:
              id: { type: integer }
              kind: { type: string }
              app_id: { type: [integer, "null"] }
              size: { type: integer }
              created_at: { type: string }
        inside:
          type: array
          items:
            type: object
            required: [id, kind, app_id, size, members]
            properties:
              id: { type: integer }
              kind: { type: string }
              app_id: { type: [integer, "null"] }
              size: { type: integer }
              members: { type: array, items: { type: string } }
    PurgeInput:
      type: object
      required: [note]
      properties:
        note: { type: string, minLength: 3, maxLength: 500, description: "Why (kept in the tombstone and the audit history)." }
    PurgeResult:
      type: object
      required: [sha256, tombstone_id, artifacts_deleted, containers_deleted, other_versions_deleted, freed_bytes]
      properties:
        sha256: { $ref: "#/components/schemas/Sha256" }
        tombstone_id: { type: integer }
        artifacts_deleted: { type: integer }
        containers_deleted:
          type: array
          items:
            type: object
            required: [id, kind, members]
            properties:
              id: { type: integer }
              kind: { type: string }
              members: { type: array, items: { type: string } }
        other_versions_deleted: { type: integer }
        freed_bytes: { type: integer }
    RecordingDeletionInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
        purge_packages: { type: boolean, default: false, description: "Also delete the frozen packages that include the recording." }
    RecordingDeletion:
      type: object
      required: [recording_id, tombstone_id, apps, uploads_deleted, packages_deleted, freed_bytes]
      properties:
        recording_id: { type: string }
        tombstone_id: { type: integer }
        apps: { type: array, items: { type: integer } }
        uploads_deleted: { type: integer }
        packages_deleted:
          type: array
          items:
            type: object
            required: [app_id, rev]
            properties:
              app_id: { type: integer }
              rev: { type: integer }
        freed_bytes: { type: integer }
    Problem:
      type: object
      description: RFC 9457 problem details; every error of /api/v1 has this shape.
      required: [type, title, status, detail]
      properties:
        type: { type: string, format: uri-reference, description: "`/errors/<code>`: a URI reference relative to the portal, stable per code (see Errors)." }
        title: { type: string, description: "The HTTP status phrase." }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, description: "The sentence to show the user." }
        instance: { type: string, description: "The request path." }
        code: { $ref: "#/components/schemas/ErrorCode" }
        request_id: { type: string, description: "The response's `Request-Id` (see Request ids)." }
        owners:
          type: array
          items: { type: string }
          description: "With `code: role` on an application: its owners, who can grant the role (only to a caller who may see them)."
        app_id: { type: integer, description: "With `code: role` on an application: the application (as in the path), for `requestAccess`." }
        requested_role: { $ref: "#/components/schemas/Role", description: "With `app_id`: the lowest role that would have been enough." }
        errors:
          type: array
          description: Per-field problems of a request body.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
        current:
          type: object
          additionalProperties: true
          description: "With `code: conflict`: the resource as the server has it now (the shape its GET answers)."
        tombstone_id: { type: [integer, "null"], description: "With `code: gone`: the tombstone that records the deletion." }
    ErrorCode:
      type: string
      description: |
        The stable machine-readable reason of an error (see Errors); `x-twinlab-codes` says what each
        means. New codes may be added within v1: treat an unknown code by its HTTP status.
      enum:
        - invalid_request
        - idempotency_key_mismatch
        - signed_out
        - wrong_credentials
        - forbidden
        - csrf
        - role
        - restricted
        - not_found
        - method_not_allowed
        - conflict
        - state_conflict
        - draft_changed
        - unchanged
        - incomplete_package
        - plan_changed
        - publish_locked
        - idempotency_in_progress
        - too_large
        - unsupported_media_type
        - idempotency_key_reused
        - internal
        - bad_gateway
        - unavailable
        - gone
        - error
      x-twinlab-codes:
        invalid_request: "The request (its body, query or headers) is not valid; `errors` names the fields."
        idempotency_key_mismatch: "`Idempotency-Key` and the body's `request_key` differ: send one key."
        signed_out: "Nobody is signed in, or the session ended: sign in again."
        wrong_credentials: "The name or password is wrong."
        forbidden: "The caller may not do this."
        csrf: "The form token (X-CSRF-Token) is missing or out of date: read the session again."
        role: "The caller lacks the role this needs; `owners` names who can grant it, where the caller may see them."
        restricted: "Restricted evidence: only who added it, its application's owners or an admin may see it."
        not_found: "There is no such resource, page or API operation."
        method_not_allowed: "The resource does not take this method."
        conflict: "A stale conditional update: someone else changed the resource; `current` is how it is now."
        state_conflict: "The action does not fit the resource's current state."
        draft_changed: "The package draft changed since it was previewed."
        unchanged: "Nothing changed since the last package revision."
        incomplete_package: "The package is missing what a build needs."
        plan_changed: "The applications changed since the merge preview."
        publish_locked: "The release cannot be published in its current state."
        idempotency_in_progress: "A request with this `Idempotency-Key` is still being processed: retry later."
        too_large: "The request body is over the portal's limit."
        unsupported_media_type: "The request body's content type is not one this operation takes."
        idempotency_key_reused: "This `Idempotency-Key` was used for a different request."
        internal: "The portal failed; the error is in its log under the response's Request-Id."
        bad_gateway: "A service the portal depends on failed."
        unavailable: "The portal is not ready (starting, migrating, or a dependency is down): retry later."
        gone: "The stored file was deleted (retention, an owner's request or a purge); a tombstone records it."
        error: "Any other HTTP error status."
    Page:
      type: object
      description: Where a page of a paginated list is (see Pagination).
      required: [total, limit, offset, next_offset]
      properties:
        total: { type: integer, minimum: 0, description: "Items matching the filters, on every page." }
        limit: { type: integer, minimum: 1 }
        offset: { type: integer, minimum: 0 }
        next_offset: { type: [integer, "null"], description: "The offset of the next page; null on the last page." }
    Revision:
      type: integer
      minimum: 0
      description: The resource's revision (see Conditional updates).
    Role:
      type: string
      enum: [viewer, builder, owner]
    AppStatus:
      type: string
      enum: [known, discovered, not_replicated]
      description: |
        The scope decision. The one mapping of values to what the pages say (journey.STATUS_LABELS,
        web/src/lib/scope.ts; `Triage.labels` and `Workboard.labels` carry it too):

        | value | label | triage decision |
        |---|---|---|
        | `known` | Replicate | `replicate` |
        | `discovered` | Needs a scope decision | (none: the state before a decision) |
        | `not_replicated` | Not replicated (used only) | `not_replicated` |

        "Same as" is not a status: it merges the application into another (the merge operations).
        An owner chooses only `known` or `not_replicated`; `discovered` is set by a recording.
    ShareState:
      type: string
      enum: [restricted, reviewed, synthetic]
    ReleaseState:
      type: string
      enum: [packaged, tested, published]
    TestResult:
      type: string
      enum: [pass, fail, not-run]
    BuildState:
      type: string
      enum: [queued, starting, checking_started, running, waiting_for_answer, ready_for_verification, failed, cancelled]
    Choice:
      type: object
      required: [value, label]
      properties:
        value: { type: string }
        label: { type: string }
    Timestamp:
      type: string
      description: ISO 8601, UTC.
    Sha256:
      type: string
      pattern: "^[0-9a-f]{64}$"
    GitSha:
      type: string
      pattern: "^[0-9a-f]{40}$"

    # -- session ----------------------------------------------------------------------------------
    Session:
      type: object
      required: [signed_in, user, is_admin, auth_mode, access_mode, login_available, csrf_token, roles]
      properties:
        signed_in: { type: boolean }
        user: { type: [string, "null"], description: "The sign-in name." }
        is_admin: { type: boolean, description: "A portal admin." }
        auth_mode:
          type: string
          enum: [local, proxy, open]
          description: |
            `local`: local user store (sign-in form); `proxy`: the OAuth proxy's `X-Forwarded-User`
            (no sign-in form, no sign-out); `open`: a single-user development portal (user `local`).
        access_mode:
          type: string
          enum: [local-dev, individual, trusted-proxy]
          description: |
            The portal's auth mode (`TWINLAB2_AUTH_MODE`, or derived): `local-dev` only this machine as
            the admin `local`; `individual` everyone signs in with their own password (a shared demo
            password signs in only as the one demo identity, never an admin); `trusted-proxy` identity
            only from the SSO proxy's headers, only on requests that come through the proxy.
        login_available: { type: boolean, description: "Whether the sign-in form applies." }
        csrf_token: { type: string, description: "Send as `X-CSRF-Token` on every non-GET request." }
        roles:
          type: array
          description: The caller's role on each application they have one on.
          items: { $ref: "#/components/schemas/AppRole" }
        can_create_apps: { type: boolean, description: "Whether the caller may add an application (`TWINLAB2_APP_CREATORS`)." }
        home_role: { $ref: "#/components/schemas/HomeRole" }
    HomeRole:
      type: string
      enum: [admin, owner, builder, viewer, none]
      description: The highest role the user holds on any application (`admin` for a portal admin).
    AppRole:
      type: object
      required: [app_id, app_name, role]
      properties:
        app_id: { type: integer }
        app_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    SignIn:
      type: object
      required: [user, password]
      properties:
        user: { type: string, maxLength: 80 }
        password: { type: string }

    # -- apps -------------------------------------------------------------------------------------
    AppRef:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    JourneyStep:
      type: object
      required: [id, title, state, hint, href, action]
      properties:
        id: { type: string, enum: [choose, examples, behaviour, repository, build, verification, verify, open] }
        title: { type: string }
        state: { type: string, enum: [done, next, todo] }
        hint: { type: string, description: "What to do, in one plain sentence." }
        href: { type: string, description: "A web-app path (the web app keeps the portal's page paths, e.g. `/apps/1#examples`)." }
        action: { type: string, description: "The button's words." }
        blocked: { type: string, description: "Why the step cannot be done yet, in one sentence (empty: it can); `href` points at the fix." }
    Journey:
      type: object
      required: [stage, missing, out_of_scope, steps, next]
      properties:
        stage: { type: string }
        missing: { type: array, items: { type: string } }
        out_of_scope: { type: boolean }
        steps: { type: array, items: { $ref: "#/components/schemas/JourneyStep" } }
        next: { oneOf: [{ $ref: "#/components/schemas/JourneyStep" }, { type: "null" }] }
    TestedRelease:
      type: object
      description: An application's latest Tested or Published release.
      required: [id, version, label, commit_sha, state, platform, counts, deployment]
      properties:
        id: { type: integer }
        version: { type: string }
        label: { type: string, description: "The readable number (ReleaseSummary.label)." }
        commit_sha: { type: string }
        state: { $ref: "#/components/schemas/ReleaseState" }
        platform: { type: string }
        counts:
          type: object
          required: [pass, fail, not-run]
          properties:
            pass: { type: integer }
            fail: { type: integer }
            not-run: { type: integer }
        deployment: { oneOf: [{ $ref: "#/components/schemas/Deployment" }, { type: "null" }] }
    AppFamily:
      type: string
      enum: [decide, build, tested, published, not_replicated]
      description: |
        Where an application stands, as the catalog groups it: `decide` needs a scope decision
        (status `discovered`); `build` is replicated and has no Tested or Published release yet;
        `tested` has a Tested release and none published; `published` has a Published release;
        `not_replicated` is out of scope (status `not_replicated`).
    AppSummary:
      type: object
      required: [id, name, status, status_label, family, owner, purpose, my_role, journey, tested_release]
      properties:
        id: { type: integer }
        name: { type: string }
        status: { $ref: "#/components/schemas/AppStatus" }
        status_label: { type: string }
        family: { $ref: "#/components/schemas/AppFamily" }
        owner: { type: string, description: "The owners' names for display (roles are authoritative)." }
        purpose: { type: string }
        my_role: { oneOf: [{ $ref: "#/components/schemas/Role" }, { type: "null" }] }
        journey: { $ref: "#/components/schemas/Journey" }
        tested_release: { oneOf: [{ $ref: "#/components/schemas/TestedRelease" }, { type: "null" }] }
    CatalogGroup:
      type: object
      required: [family, label, count, offset, collapsed]
      properties:
        family: { $ref: "#/components/schemas/AppFamily" }
        label: { type: string }
        count: { type: integer, minimum: 0, description: "Matching applications of this family, on every page." }
        collapsed: { type: boolean, description: "Named in `collapsed`: counted, not paged." }
        offset:
          oneOf: [{ type: integer, minimum: 0 }, { type: "null" }]
          description: The offset of the page that starts with this family's first application; null when collapsed or empty.
    Catalog:
      type: object
      required: [apps, page, groups, filters, recordings, journey_titles]
      properties:
        apps: { type: array, items: { $ref: "#/components/schemas/AppSummary" }, description: "One page of the matching applications, family by family." }
        groups:
          type: array
          description: Every status family in order, with its count of matching applications (zero included).
          items: { $ref: "#/components/schemas/CatalogGroup" }
        page: { $ref: "#/components/schemas/Page" }
        filters:
          type: object
          description: The values to filter by, from every application the caller sees.
          required: [owners, stages]
          properties:
            owners: { type: array, items: { type: string } }
            stages: { type: array, items: { type: string } }
        recordings:
          type: array
          description: Recordings the caller may open (restricted evidence).
          items: { $ref: "#/components/schemas/RecordingRef" }
        journey_titles: { type: array, items: { type: string } }
    NewApp:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        owner: { type: string, maxLength: 120 }
        purpose: { type: string, maxLength: 500 }
    AppDetail:
      allOf:
        - { $ref: "#/components/schemas/AppSummary" }
        - type: object
          required: [revision, git_url, url_match, surface, releases, packages, statuses]
          properties:
            revision: { $ref: "#/components/schemas/Revision" }
            git_url: { type: string }
            url_match: { type: string, enum: [path, host] }
            surface: { type: string, description: "web, desktop, mainframe or empty" }
            releases: { type: array, items: { $ref: "#/components/schemas/ReleaseSummary" } }
            packages:
              type: array
              description: Builder-approved revisions, newest first; empty unless the caller is a builder or owner.
              items: { $ref: "#/components/schemas/PackageRevisionSummary" }
            statuses: { type: array, items: { $ref: "#/components/schemas/Choice" } }
    AppUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        purpose: { type: string, maxLength: 500 }
        git_url: { type: string, maxLength: 500 }
        status: { $ref: "#/components/schemas/AppStatus" }
        owner: { type: string, maxLength: 120, description: "Assigns this user the owner role." }
        expected_revision: { $ref: "#/components/schemas/Revision" }
    RoleAssignment:
      type: object
      required: [user_name, role]
      properties:
        user_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        assigned_by: { type: [string, "null"] }
        assigned_at: { type: [string, "null"] }
    RoleList:
      type: object
      required: [roles, role_names]
      properties:
        roles: { type: array, items: { $ref: "#/components/schemas/RoleAssignment" } }
        role_names: { type: array, items: { $ref: "#/components/schemas/Role" } }
    RoleUpdate:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }
    AuditEntry:
      type: object
      required: [id, at, actor, action, object_type, object_id, details]
      properties:
        id: { type: integer }
        at: { $ref: "#/components/schemas/Timestamp" }
        actor: { type: string }
        action: { type: string }
        object_type: { type: string }
        object_id: { type: string }
        details: { type: object, additionalProperties: true }
    History:
      type: object
      required: [app, entries]
      properties:
        app: { $ref: "#/components/schemas/AppRef" }
        entries: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
    Identity:
      type: object
      required: [key, surface]
      properties:
        key: { type: string, description: "exe:…, web:…, mainframe:… or desktop:…" }
        surface: { type: string }
    AppSetup:
      type: object
      required: [app, identities, platforms, github_repo, github_token_configured, default_windows_pattern, releases,
                 data_backends, data_backend, deployment]
      properties:
        app:
          type: object
          required: [id, revision, name, git_url, url_match, required_checks, target_platform, windows_check_pattern, lab_url, launch,
                     data_backend]
          properties:
            id: { type: integer }
            revision: { $ref: "#/components/schemas/Revision" }
            name: { type: string }
            git_url: { type: string }
            url_match: { type: string, enum: [path, host] }
            data_backend: { type: string, enum: ["", sqlite, postgresql, sqlserver], description: "What the owner chose; empty: predicted" }
            required_checks: { type: string }
            target_platform: { type: string }
            windows_check_pattern: { type: string }
            lab_url: { type: string }
            launch: { type: string }
        identities: { type: array, items: { $ref: "#/components/schemas/Identity" } }
        platforms: { type: array, items: { $ref: "#/components/schemas/Choice" } }
        github_repo: { type: [string, "null"] }
        github_token_configured: { type: boolean }
        default_windows_pattern: { type: string }
        releases: { type: array, items: { $ref: "#/components/schemas/ReleaseSummary" } }
        data_backends: { type: array, items: { $ref: "#/components/schemas/Choice" } }
        data_backend: { $ref: "#/components/schemas/DataBackend" }
        deployment:
          type: object
          description: How the demo is deployed, as its build pack describes it.
          required: [kind, files]
          properties:
            kind: { type: string, enum: [openshift, local] }
            files: { type: array, items: { type: string }, description: "The files the pack carries for it (deploy/ocp/<name>/...)" }
    DataBackend:
      type: object
      description: The backend the build pack names, chosen by the owner or predicted from the data model's dialect.
      required: [engine, source, reason, tables]
      properties:
        engine: { type: string, enum: [sqlite, postgresql, sqlserver] }
        source: { type: string, enum: [chosen, predicted] }
        reason: { type: string }
        tables: { type: array, items: { type: string }, description: "The tables the data model's DDL creates" }
    DataBackendInput:
      type: object
      required: [data_backend]
      properties:
        data_backend: { type: string, enum: ["", sqlite, postgresql, sqlserver] }
        expected_revision: { $ref: "#/components/schemas/Revision" }
    IdentityInput:
      type: object
      required: [key]
      properties:
        key: { type: string, description: "CaseDesk.exe, https://host/path, tn3270://host:port or desktop:Company/Product" }
    UrlMatchInput:
      type: object
      required: [url_match]
      properties:
        url_match: { type: string, enum: [path, host] }
        expected_revision: { $ref: "#/components/schemas/Revision" }
    VerificationSettings:
      type: object
      required: [required_checks, target_platform]
      properties:
        required_checks: { type: string, maxLength: 4000, description: "One check name or glob per line; empty means every check reported." }
        target_platform: { type: string, enum: ["", web, windows-desktop, mainframe] }
        windows_check_pattern: { type: string, maxLength: 200 }
        lab_url: { type: string, maxLength: 500 }
        launch: { type: string, maxLength: 8000 }
        expected_revision: { $ref: "#/components/schemas/Revision" }
    VerifyCommitInput:
      type: object
      required: [sha]
      properties:
        repo: { type: string, description: "owner/name; defaults to the application's GitHub repository." }
        sha: { $ref: "#/components/schemas/GitSha" }
        pr_number: { type: integer, minimum: 1 }
        ref: { type: string, maxLength: 200 }
        build_id: { type: integer, description: "The build session the commit is from." }
        request_key: { type: string, maxLength: 100, description: "Names one verification: a repeated request with it gets the same one." }
        targets: { $ref: "#/components/schemas/VerifyTargets" }
    VerifyInput:
      type: object
      properties:
        request_key: { type: string, maxLength: 100, description: "Names one verification: a repeated request with it gets the same one." }
        targets: { $ref: "#/components/schemas/VerifyTargets" }
    VerifyTargets:
      type: object
      description: Where to replay a surface that the deployment URL does not name.
      properties:
        mainframe: { type: string, maxLength: 300, description: "The rebuilt TN3270 host, host:port (default: the deployment URL's host and port)." }
        desktop: { type: string, maxLength: 300, description: "The built executable, relative to the Windows verifier's builds folder (TWINLAB2_DESKTOP_BUILDS)." }
    VerificationScenario:
      type: object
      required: [id, name, state]
      properties:
        id: { type: string }
        name: { type: string }
        state: { type: string, description: "pending, running, then pass, fail or not-run." }
        result: { type: [string, "null"], enum: [pass, fail, not-run, null] }
        why: { type: [string, "null"] }
        surface: { type: [string, "null"], description: "web, mainframe, desktop (several: comma-separated)." }
    Verification:
      type: object
      required: [id, app_id, release_id, kind, state, commit_sha, requested_by, request_key, attempts, created_at,
                 started_at, finished_at, progress, tested, reasons, report, scope, dimensions, checks, error]
      properties:
        id: { type: integer }
        app_id: { type: integer }
        release_id: { type: [integer, "null"], description: "Known once the commit is packaged (verify-commit)." }
        kind: { type: string, enum: [release, commit] }
        state: { type: string, enum: [queued, running, passed, failed, error] }
        commit_sha: { type: [string, "null"] }
        requested_by: { type: string }
        request_key: { type: string }
        attempts: { type: integer, description: "How many times a worker started it (a worker that stopped mid-run is taken over)." }
        created_at: { type: string }
        started_at: { type: [string, "null"] }
        finished_at: { type: [string, "null"] }
        progress:
          type: object
          required: [stage, total, done, scenarios]
          properties:
            stage: { type: string }
            total: { type: integer }
            done: { type: integer }
            scenarios: { type: array, items: { $ref: "#/components/schemas/VerificationScenario" } }
        tested: { type: [boolean, "null"] }
        reasons: { type: array, items: { type: string } }
        report:
          oneOf:
            - type: object
              required: [id, sha256, url]
              properties:
                id: { type: integer }
                sha256: { type: string }
                url: { type: [string, "null"] }
            - { type: "null" }
        scope: { type: [object, "null"], additionalProperties: true, description: "What Tested covers (scenarios, platform, role, commit, deployment)." }
        dimensions:
          oneOf:
            - type: object
              description: >-
                behavioural, structural, visual and deployment, each with `status` (pass, fail, blocked,
                reported: visual states that do not decide, or not-checked), `scope` (what it covered) and its counts.
              additionalProperties:
                type: object
                additionalProperties: true
            - { type: "null" }
        checks:
          type: array
          description: >-
            Verify's acceptance checks, each judged on its own: ci, commit_identity, scenarios, fixture_reset,
            persistence, failure_scenarios, visual_coverage. A failed one keeps the release from Tested.
          items: { $ref: "#/components/schemas/AcceptanceCheck" }
        error: { type: [string, "null"] }
    AcceptanceCheck:
      type: object
      required: [id, label, status, detail, required]
      properties:
        id: { type: string }
        label: { type: string }
        status: { type: string, enum: [pass, fail, not-checked] }
        detail: { type: string }
        required: { type: boolean, description: "Whether its failure blocks Tested (a not-checked check never does)." }
    MergeSide:
      type: object
      required: [id, name, url_match]
      properties:
        id: { type: integer }
        name: { type: string }
        url_match: { type: string }
    MergePlan:
      type: object
      required: [source, target, identities, flows, links, combined, automations, briefs, scenarios, blockers, fingerprint]
      properties:
        source: { $ref: "#/components/schemas/MergeSide" }
        target: { $ref: "#/components/schemas/MergeSide" }
        identities: { type: array, items: { type: string } }
        flows:
          type: array
          items:
            type: object
            required: [recording_id, name, key, shared]
            properties:
              recording_id: { type: string }
              name: { type: string }
              key: { type: string }
              shared: { type: boolean }
        links:
          type: array
          items:
            type: object
            required: [recording_id, name, selected]
            properties:
              recording_id: { type: string }
              name: { type: string }
              selected: { type: integer }
        combined:
          type: array
          items:
            type: object
            required: [recording_id, name, shown, shown_suggested, source, target, selection, suggested, notes, reviewed]
            properties:
              recording_id: { type: string }
              name: { type: string }
              shown: { type: array, items: { type: integer } }
              shown_suggested: { type: array, items: { type: integer } }
              source: { type: array, items: { type: string } }
              target: { type: array, items: { type: string } }
              selection: { type: array, items: { type: string } }
              suggested: { type: array, items: { type: string } }
              notes: { type: string }
              reviewed: { type: integer, enum: [0, 1] }
        automations: { type: array, items: { type: string } }
        briefs:
          type: array
          items:
            type: object
            required: [revision, package]
            properties:
              revision: { type: string }
              package: { type: boolean }
        scenarios: { type: array, items: { type: string } }
        blockers: { type: array, items: { type: string } }
        fingerprint: { type: string }
    MergeInput:
      type: object
      required: [into, confirm]
      properties:
        into: { type: integer }
        confirm: { type: string, description: "The plan's fingerprint." }

    # -- evidence ---------------------------------------------------------------------------------
    FlowStep:
      type: object
      description: One recorded step of an application.
      required: [n, action]
      properties:
        n: { type: integer }
        seq: { type: integer }
        event_id: { type: string }
        action: { type: string }
        key: { type: [string, "null"] }
        control: { type: [string, "null"] }
        label: { type: [string, "null"] }
        screen: { type: [string, "null"] }
    RecordedFlow:
      type: object
      required: [recording_id, recording_name, key, level, machine, received_at, steps]
      properties:
        recording_id: { type: string }
        recording_name: { type: string }
        key: { type: string }
        level: { type: string, enum: [full, steps] }
        machine: { type: [string, "null"] }
        received_at: { type: [string, "null"] }
        steps: { type: array, items: { $ref: "#/components/schemas/FlowStep" } }
    EvidenceLink:
      type: object
      required: [recording_id, name, selected_count, suggested_count, reviewed, notes]
      properties:
        recording_id: { type: string }
        name: { type: string }
        selected_count: { type: integer }
        suggested_count: { type: integer, description: "New events from a later send, not yet reviewed." }
        reviewed: { type: boolean }
        notes: { type: string }
    Attachment:
      type: object
      required: [id, title, kind, extension, share, added_by]
      properties:
        id: { type: integer }
        title: { type: string }
        kind: { type: string, enum: [Screen, API, Database, Utility, Acceptance] }
        extension: { type: string }
        share: { $ref: "#/components/schemas/ShareState" }
        added_by: { type: string }
    AttachmentUpload:
      type: object
      required: [file, title, kind]
      properties:
        file: { type: string, contentMediaType: application/octet-stream }
        title: { type: string, maxLength: 200 }
        kind: { type: string, enum: [Screen, API, Database, Utility, Acceptance] }
        share: { $ref: "#/components/schemas/ShareState" }
    ShareInput:
      type: object
      required: [share]
      properties:
        share: { $ref: "#/components/schemas/ShareState" }
    AutomationRef:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    AppEvidence:
      type: object
      required: [recorded_flows, links, attachments, automations, attachment_kinds, share_states, merge_candidates]
      properties:
        recorded_flows: { type: array, items: { $ref: "#/components/schemas/RecordedFlow" } }
        links: { type: array, items: { $ref: "#/components/schemas/EvidenceLink" } }
        attachments: { type: array, items: { $ref: "#/components/schemas/Attachment" } }
        automations: { type: array, items: { $ref: "#/components/schemas/AutomationRef" } }
        attachment_kinds:
          type: object
          description: Per evidence kind, the file extensions it accepts.
          additionalProperties: { type: array, items: { type: string } }
        share_states: { type: array, items: { $ref: "#/components/schemas/Choice" } }
        merge_candidates:
          type: array
          description: Other applications the caller can view, to merge this one into.
          items: { $ref: "#/components/schemas/AppRef" }
    ScenarioInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        starting: { type: string, maxLength: 4000 }
        actions: { type: string, maxLength: 8000 }
        expected: { type: string, maxLength: 4000 }
        failures: { type: string, maxLength: 4000 }
        examples: { type: string, maxLength: 4000 }
        questions: { type: string, maxLength: 4000 }
        notes: { type: string, maxLength: 20000 }
        events:
          type: array
          description: Linked events as `recording#event_id`, from the selected events of the application.
          items: { type: string }
        bindings:
          type: array
          description: Each typing or selecting linked event bound to a fixture field or shared identifier. Left out, the bindings stay as they are.
          items: { $ref: "#/components/schemas/Binding" }
        expected_revision: { $ref: "#/components/schemas/Revision" }
    Scenario:
      allOf:
        - { $ref: "#/components/schemas/ScenarioInput" }
        - type: object
          required: [id, revision, name, starting, actions, expected, failures, examples, questions, notes, events]
          properties:
            id: { type: integer }
            revision: { $ref: "#/components/schemas/Revision" }
    ScenarioField:
      type: object
      required: [key, label, max_length]
      properties:
        key: { type: string }
        label: { type: string }
        max_length: { type: integer }
    EventChoice:
      type: object
      required: [ref, seq, action, recording]
      properties:
        ref: { type: string, description: "recording#event_id" }
        seq: { type: integer }
        action: { type: string }
        label: { type: [string, "null"] }
        screen: { type: [string, "null"] }
        recording: { type: string }
    ScenarioList:
      type: object
      required: [scenarios, fields, event_choices]
      properties:
        scenarios: { type: array, items: { $ref: "#/components/schemas/Scenario" } }
        fields: { type: array, items: { $ref: "#/components/schemas/ScenarioField" } }
        event_choices: { type: array, items: { $ref: "#/components/schemas/EventChoice" } }
        identifiers:
          type: array
          description: The shared identifiers of the interface contracts this application is in (bindable).
          items: { $ref: "#/components/schemas/SharedIdentifier" }

    Binding:
      type: object
      required: [event]
      description: A typing or selecting step bound to a fixture field (an example line's field) or a shared identifier.
      properties:
        event: { type: string, description: "recording#event_id, one of the scenario's linked events" }
        field: { type: string, maxLength: 60 }
        identifier: { type: string, maxLength: 60 }
    SharedIdentifier:
      type: object
      required: [name, field, type, value, producer, consumers]
      properties:
        name: { type: string }
        field: { type: string }
        type: { type: string }
        value: { type: string }
        producer: { type: [integer, "null"] }
        consumers: { type: array, items: { type: integer } }
    InterfaceRelationship:
      type: object
      required: [kind, producer, consumer, when_down]
      properties:
        kind: { type: string, enum: [identifier, api, file] }
        producer: { type: integer }
        consumer: { type: integer }
        identifier: { type: string }
        when_down: { type: string, description: "What the consumer does when the producer is down." }
        detail: { type: object, additionalProperties: true, description: "The schema: api: method, path, request, response; file: format, columns." }
    InterfaceApp:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    InterfaceDoc:
      type: object
      required: [version, apps, identifiers, relationships, launch_order, reset_order]
      properties:
        version: { type: integer }
        recording_id: { type: string }
        apps: { type: array, items: { $ref: "#/components/schemas/InterfaceApp" } }
        identifiers: { type: array, items: { $ref: "#/components/schemas/SharedIdentifier" } }
        relationships: { type: array, items: { $ref: "#/components/schemas/InterfaceRelationship" } }
        launch_order: { type: array, items: { type: integer } }
        reset_order: { type: array, items: { type: integer } }
    InterfaceContract:
      type: object
      required: [recording_id, edited, revision, doc]
      properties:
        recording_id: { type: string }
        edited: { type: boolean, description: "An owner edited it (else it is the one inferred from the recording)." }
        revision: { type: integer }
        edited_by: { type: [string, "null"] }
        edited_at: { type: [string, "null"] }
        doc: { $ref: "#/components/schemas/InterfaceDoc" }
        generated: { oneOf: [{ $ref: "#/components/schemas/InterfaceDoc" }, { type: "null" }] }
    InterfaceList:
      type: object
      required: [contracts]
      properties:
        contracts: { type: array, items: { $ref: "#/components/schemas/InterfaceContract" } }
    InterfaceInput:
      type: object
      required: [doc]
      properties:
        doc: { $ref: "#/components/schemas/InterfaceDoc" }
        expected_revision: { type: integer }
    NeededState:
      type: object
      required: [screen, state, number, events]
      properties:
        screen: { type: string }
        state: { type: string }
        number: { type: integer, description: "The state's number on its screen (1-based)." }
        events: { type: array, items: { type: string } }
    BaselineCandidate:
      type: object
      required: [source, label]
      properties:
        source: { type: string, enum: [recording, attachment] }
        label: { type: string }
        attachment_id: { type: integer }
        recording_id: { type: string }
        event_id: { type: string }
        screen: { type: [string, "null"] }
        state: { type: [string, "null"] }
    Baseline:
      type: object
      required: [id, screen, state, viewport, theme, scale, source, sha256, approved_by, approved_at]
      properties:
        id: { type: integer }
        screen: { type: string }
        state: { type: string }
        viewport: { type: string }
        theme: { type: string, enum: [light, dark] }
        scale: { type: string }
        source: { type: string }
        attachment_id: { type: [integer, "null"] }
        recording_id: { type: [string, "null"] }
        event_id: { type: [string, "null"] }
        sha256: { type: string }
        approved_by: { type: string }
        approved_at: { type: string }
    BaselineList:
      type: object
      required: [needed, approved, candidates]
      properties:
        needed: { type: array, items: { $ref: "#/components/schemas/NeededState" } }
        approved: { type: array, items: { $ref: "#/components/schemas/Baseline" } }
        candidates: { type: array, items: { $ref: "#/components/schemas/BaselineCandidate" } }
    BaselineSource:
      type: object
      properties:
        attachment_id: { type: integer }
        recording_id: { type: string }
        event_id: { type: string }
    BaselineInput:
      type: object
      required: [screen, state, viewport, theme, scale, source]
      properties:
        screen: { type: string }
        state: { type: string }
        viewport: { type: string, pattern: "^[0-9]{2,5}x[0-9]{2,5}$" }
        theme: { type: string, enum: [light, dark] }
        scale: { type: string }
        source: { $ref: "#/components/schemas/BaselineSource" }
    ConfirmationInput:
      type: object
      properties:
        note: { type: string, maxLength: 1000 }
    Confirmation:
      type: object
      required: [item, note]
      properties:
        item: { type: string }
        note: { type: string }
    CompletenessItem:
      type: object
      required: [item, title, section, dimension, severity, status, level, confirmed]
      properties:
        item: { type: string }
        title: { type: string }
        section: { type: string }
        dimension: { type: string }
        severity: { type: string, enum: [critical, important, nice] }
        status: { type: string, enum: [present, missing, not_applicable] }
        level:
          description: "The evidence of a present item: documented (written only), observed (in the recording), owner-confirmed, replay-tested (after Verify); null when missing or not applicable."
          oneOf: [{ type: string, enum: [documented, observed, owner-confirmed, replay-tested] }, { type: "null" }]
        confirmed: { type: boolean }
    EvidenceLevels:
      type: object
      required: [missing, documented, observed, owner-confirmed, replay-tested]
      properties:
        missing: { type: integer }
        documented: { type: integer }
        observed: { type: integer }
        owner-confirmed: { type: integer }
        replay-tested: { type: integer }

    # -- packages ---------------------------------------------------------------------------------
    PackageFile:
      type: object
      required: [path, size, sha256]
      properties:
        path: { type: string }
        size: { type: integer }
        sha256: { $ref: "#/components/schemas/Sha256" }
        text: { type: [string, "null"], description: "A text file in full; null for a binary file. Absent in a revision's file list." }
    ReportEntry:
      type: object
      required: [item, outcome, reasons]
      properties:
        item: { type: string }
        outcome: { type: string, description: "excluded, redacted, …" }
        reasons: { type: array, items: { type: string } }
    PackageRevisionSummary:
      type: object
      required: [rev, revision, sha256, size, approved_by, approved_at]
      properties:
        rev: { type: integer, minimum: 1 }
        revision: { type: string, description: "The content revision." }
        sha256: { $ref: "#/components/schemas/Sha256" }
        size: { type: integer }
        approved_by: { type: string }
        approved_at: { $ref: "#/components/schemas/Timestamp" }
    PackageRevision:
      allOf:
        - { $ref: "#/components/schemas/PackageRevisionSummary" }
        - type: object
          required: [app, summary, diff, files, report, completeness, known_gaps]
          properties:
            app: { $ref: "#/components/schemas/AppRef" }
            summary: { type: string, description: "The change summary." }
            diff: { type: string, description: "Against the previous revision; the first revision is diffed against nothing (every line added)." }
            files: { type: array, items: { $ref: "#/components/schemas/PackageFile" } }
            report:
              description: The pre-freeze report; null unless the caller is an owner.
              oneOf: [{ type: array, items: { $ref: "#/components/schemas/ReportEntry" } }, { type: "null" }]
            completeness:
              description: The completeness of the frozen package; null for a revision frozen before it was checked.
              oneOf: [{ $ref: "#/components/schemas/PackageCompleteness" }, { type: "null" }]
            known_gaps:
              description: The owner's reason for freezing over critical gaps, and those gaps; null when none were overridden.
              oneOf: [{ $ref: "#/components/schemas/KnownGaps" }, { type: "null" }]
    CompletenessFix:
      type: object
      required: [page, href, action]
      properties:
        page: { type: string, description: "The page (and section) where the owner fixes it." }
        href: { type: string, description: "The web app's path of that page." }
        action: { type: string, description: "What to do there." }
    CompletenessGap:
      type: object
      required: [item, title, section, dimension, severity, why, fix, details]
      properties:
        item: { type: string, description: "The spec item, e.g. scenario.expected." }
        title: { type: string }
        section: { type: string }
        dimension: { type: string, enum: [behavioural, structural, visual, deployment], description: "The verification dimension the item serves." }
        severity: { type: string, enum: [critical, important, nice] }
        why: { type: string, description: "Why the builder or the replay needs it." }
        fix: { $ref: "#/components/schemas/CompletenessFix" }
        details: { type: array, items: { type: string }, description: "Which scenario, screen or event lacks it." }
        capture_gap: { type: string, description: "Set when today's recorder or pack builder cannot produce the item at all." }
    CompletenessSection:
      type: object
      required: [id, title, score, present, missing, not_applicable]
      properties:
        id: { type: string }
        title: { type: string }
        score: { type: integer, minimum: 0, maximum: 100 }
        present: { type: array, items: { type: string } }
        missing: { type: array, items: { type: string } }
        not_applicable: { type: array, items: { type: string } }
    CompletenessCounts:
      type: object
      required: [critical, important, nice]
      properties:
        critical: { type: integer }
        important: { type: integer }
        nice: { type: integer }
    PackageCompleteness:
      type: object
      description: A package checked against the package completeness spec (server/twinlab2/pack_validator.py).
      required: [spec_version, surface, passed, score, sections, dimensions, gaps, counts]
      properties:
        spec_version: { type: integer }
        surface: { type: string, enum: [web, desktop, mainframe] }
        passed: { type: boolean, description: "No critical item is missing." }
        score: { type: integer, minimum: 0, maximum: 100, description: "Present items weighted by severity (critical 3, important 2, nice 1): documented counts as present here; see `coverage`." }
        sections: { type: array, items: { $ref: "#/components/schemas/CompletenessSection" } }
        dimensions:
          type: array
          description: "The same items scored per verification dimension: behavioural, structural, visual, deployment."
          items: { $ref: "#/components/schemas/CompletenessSection" }
        gaps: { type: array, items: { $ref: "#/components/schemas/CompletenessGap" }, description: "Most severe first." }
        counts: { $ref: "#/components/schemas/CompletenessCounts" }
        coverage: { type: integer, minimum: 0, maximum: 100, description: "Applicable items at evidence level observed or above, weighted by severity: documented-only items do not count. Kept apart from `score` (presence)." }
        levels: { $ref: "#/components/schemas/EvidenceLevels" }
        items: { type: array, items: { $ref: "#/components/schemas/CompletenessItem" }, description: "Every item of the spec for this surface, with its evidence level." }
    KnownGap:
      type: object
      required: [item, title]
      properties:
        item: { type: string }
        title: { type: string }
    KnownGaps:
      type: object
      required: [reason, gaps]
      properties:
        reason: { type: string }
        gaps: { type: array, items: { $ref: "#/components/schemas/KnownGap" } }
    PackageList:
      type: object
      required: [app, packages]
      properties:
        app: { $ref: "#/components/schemas/AppRef" }
        packages: { type: array, items: { $ref: "#/components/schemas/PackageRevisionSummary" } }
    PackageDraft:
      type: object
      required: [app, revision, sha256, size, files, report, summary, latest, unchanged, next_rev, completeness, known_gaps]
      properties:
        app: { $ref: "#/components/schemas/AppRef" }
        revision: { type: string }
        sha256: { $ref: "#/components/schemas/Sha256" }
        size: { type: integer }
        files: { type: array, items: { $ref: "#/components/schemas/PackageFile" } }
        report: { type: array, items: { $ref: "#/components/schemas/ReportEntry" } }
        summary: { type: string, description: "The pre-freeze report in one sentence." }
        latest: { oneOf: [{ $ref: "#/components/schemas/PackageRevisionSummary" }, { type: "null" }] }
        unchanged: { type: boolean, description: "The draft is the latest revision's bytes; nothing to freeze." }
        next_rev: { type: integer }
        completeness: { $ref: "#/components/schemas/PackageCompleteness" }
        known_gaps:
          description: The reason and gaps this draft carries (previewed with `override_reason` over critical gaps); else null.
          oneOf: [{ $ref: "#/components/schemas/KnownGaps" }, { type: "null" }]
    FreezeInput:
      type: object
      required: [sha256, approve]
      properties:
        sha256: { $ref: "#/components/schemas/Sha256" }
        summary: { type: string, description: "What changed and why." }
        approve: { type: boolean, const: true, description: "The owner approves exactly these bytes." }
        override_reason: { type: string, description: "Freeze despite critical completeness gaps, for this reason (at least 10 characters; audited and carried by the package). The same reason the draft was previewed with." }

    # -- builds -----------------------------------------------------------------------------------
    ApprovedPack:
      allOf:
        - { $ref: "#/components/schemas/PackageRevisionSummary" }
        - type: object
          required: [files]
          properties:
            files: { type: array, items: { $ref: "#/components/schemas/PackageFile" } }
    Repo:
      type: object
      required: [repo, default_branch, private, connected_by]
      properties:
        repo: { type: string }
        default_branch: { type: string }
        private: { type: boolean }
        connected_by: { type: string }
    Provider:
      type: object
      required: [name, label, capabilities, capability_text, ready, budget_unit, budget, model, status_label]
      properties:
        name: { type: string }
        label: { type: string }
        capabilities: { type: array, items: { type: string } }
        capability_text: { type: string }
        ready: { type: [string, "null"], description: "Null when ready; else why it is not." }
        budget_unit: { type: string }
        budget: { type: number }
        model: { type: string }
        status_label: { type: string }
    Build:
      type: object
      required: [id, app_id, provider, provider_label, model, state, state_label, final, revision, package_rev, pack_sha256,
                 repo, base_branch, base_sha, branch, parent_build, budget, budget_unit, cost, cost_unit, pr_number, pr_url,
                 head_sha, outstanding, requested_by, created_at]
      properties:
        id: { type: integer }
        app_id: { type: integer }
        provider: { type: string }
        provider_label: { type: string }
        model: { type: string }
        state: { $ref: "#/components/schemas/BuildState" }
        state_label: { type: string }
        final: { type: boolean, description: "ready_for_verification, failed or cancelled." }
        revision: { type: string }
        package_rev: { type: [integer, "null"] }
        pack_sha256: { type: string }
        repo: { type: string }
        base_branch: { type: string }
        base_sha: { type: string }
        branch: { type: string }
        parent_build: { type: [integer, "null"] }
        budget: { type: number }
        budget_unit: { type: string }
        cost: { type: [number, "null"] }
        cost_unit: { type: string }
        pr_number: { type: [integer, "null"] }
        pr_url: { type: [string, "null"] }
        head_sha: { type: [string, "null"] }
        outstanding: { type: integer, description: "Questions and tool approvals waiting for an answer." }
        requested_by: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    BuildFull:
      allOf:
        - { $ref: "#/components/schemas/Build" }
        - type: object
          required: [error, note, change_summary, previous_revision, provider_session_id, provider_url, provider_status, provider_detail]
          properties:
            error: { type: [string, "null"] }
            note: { type: [string, "null"] }
            change_summary: { type: string }
            previous_revision: { type: [string, "null"] }
            provider_session_id: { type: [string, "null"] }
            provider_url: { type: [string, "null"] }
            provider_status: { type: [string, "null"] }
            provider_detail: { type: [string, "null"] }
    BuildPage:
      type: object
      required: [app, pack, problem, frozen, repos, providers, revisions, sessions, previous, changes, default_budget, starting_points]
      properties:
        app: { $ref: "#/components/schemas/AppRef" }
        pack: { oneOf: [{ $ref: "#/components/schemas/ApprovedPack" }, { type: "null" }] }
        problem: { type: [string, "null"], description: "Why there is no approved package yet." }
        frozen:
          oneOf:
            - type: object
              required: [frozen_by, frozen_at]
              properties:
                frozen_by: { type: string }
                frozen_at: { $ref: "#/components/schemas/Timestamp" }
            - { type: "null" }
        repos: { type: array, items: { $ref: "#/components/schemas/Repo" } }
        providers: { type: array, items: { $ref: "#/components/schemas/Provider" } }
        revisions: { type: array, items: { $ref: "#/components/schemas/PackageRevisionSummary" } }
        sessions: { type: array, items: { $ref: "#/components/schemas/Build" } }
        previous: { oneOf: [{ $ref: "#/components/schemas/Build" }, { type: "null" }] }
        changes: { type: array, items: { type: string }, description: "What changed in the pack since the previous session's revision." }
        default_budget: { type: number }
        starting_points: { type: array, items: { $ref: "#/components/schemas/Build" }, description: "Sessions with a commit to start from." }
    NewBuild:
      type: object
      required: [provider, revision, repo, budget]
      properties:
        provider: { type: string }
        model: { type: string }
        revision: { type: string, description: "A frozen content revision of the application." }
        repo: { type: string }
        base_branch: { type: string }
        start_from_build: { type: integer, description: "Start from that session's commit (the session becomes the parent)." }
        change_summary: { type: string, description: "Required for a later build of a changed pack." }
        budget: { type: number, exclusiveMinimum: 0, description: "In the provider's unit (Devin ACU, Claude USD, Copilot premium requests)." }
        request_key: { type: string, description: "Alias of the `Idempotency-Key` header (see Idempotency); one of the two is expected." }
    BuildStarted:
      type: object
      required: [build, created]
      properties:
        build: { $ref: "#/components/schemas/Build" }
        created: { type: boolean }
        notice: { type: [string, "null"] }
    RequestKey:
      type: object
      properties:
        request_key: { type: string, description: "Alias of the `Idempotency-Key` header (see Idempotency)." }
    BuildMessage:
      type: object
      required: [id, direction, kind, author, body, created_at, state, state_label, error, reply_to, scenario_id, data, decision]
      properties:
        id: { type: integer }
        direction: { type: string, enum: [from_provider, to_provider] }
        kind: { type: string, enum: [clarification, tool_approval, scope_change, status] }
        author: { type: string }
        body: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        state: { type: [string, "null"], description: "Delivery of a message to the provider: queued, sending, sent, acknowledged, delivery_uncertain, failed, held_for_review, received." }
        state_label: { type: [string, "null"] }
        error: { type: [string, "null"] }
        reply_to: { type: [integer, "null"] }
        scenario_id: { type: [integer, "null"], description: "A scope change proposed as this scenario." }
        data: { type: object, additionalProperties: true, description: "A tool approval: {tool, input}." }
        decision: { type: [string, "null"], description: "A tool approval already answered: approve or deny." }
    BuildDetail:
      type: object
      required: [build, app, messages, questions, outstanding, capabilities, parent, frozen]
      properties:
        build: { $ref: "#/components/schemas/BuildFull" }
        app: { $ref: "#/components/schemas/AppRef" }
        messages: { type: array, items: { $ref: "#/components/schemas/BuildMessage" } }
        questions: { type: array, items: { type: string } }
        outstanding:
          type: array
          items:
            type: object
            required: [id, kind]
            properties:
              id: { type: integer }
              kind: { type: string }
        capabilities: { type: array, items: { type: string } }
        parent: { oneOf: [{ $ref: "#/components/schemas/Build" }, { type: "null" }] }
        frozen: { type: boolean }
        notice: { type: [string, "null"] }
    AnswerInput:
      type: object
      required: [answer]
      properties:
        answer: { type: string, minLength: 1 }
        scope_change: { type: boolean, default: false }
        reply_to: { type: [integer, "null"] }
        request_key: { type: string, description: "Alias of the `Idempotency-Key` header (see Idempotency)." }
    AnswerResult:
      type: object
      required: [message, created]
      properties:
        message: { $ref: "#/components/schemas/BuildMessage" }
        created: { type: boolean }
        notice: { type: [string, "null"] }
    ToolDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, deny] }
        request_key: { type: string, description: "Alias of the `Idempotency-Key` header (see Idempotency)." }
    CompareInput:
      type: object
      required: [sessions]
      properties:
        sessions: { type: array, items: { type: integer }, minItems: 1 }
    Candidate:
      type: object
      required: [build, release, checks, reasons, tested, scenarios]
      properties:
        build: { $ref: "#/components/schemas/Build" }
        release: { oneOf: [{ $ref: "#/components/schemas/ReleaseSummary" }, { type: "null" }] }
        checks:
          type: array
          items:
            type: object
            required: [name, conclusion]
            properties:
              name: { type: string }
              conclusion: { type: string }
        reasons: { type: array, items: { type: string } }
        tested: { type: boolean }
        scenarios:
          type: array
          items:
            type: object
            required: [name, result]
            properties:
              name: { type: string }
              result: { $ref: "#/components/schemas/TestResult" }
    Comparison:
      type: object
      required: [app, results]
      properties:
        app: { $ref: "#/components/schemas/AppRef" }
        results: { type: array, items: { $ref: "#/components/schemas/Candidate" } }
        errors:
          type: array
          items:
            type: object
            required: [build_id, detail]
            properties:
              build_id: { type: integer }
              detail: { type: string }
        verifications:
          type: array
          description: The verifications queued for the candidates (POST); their results fill in as they end.
          items: { $ref: "#/components/schemas/Verification" }

    # -- recordings -------------------------------------------------------------------------------
    RecordingRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    Gap:
      type: object
      required: [from, to]
      properties:
        from: { $ref: "#/components/schemas/Timestamp" }
        to: { $ref: "#/components/schemas/Timestamp" }
        reason: { type: [string, "null"] }
    Channel:
      type: object
      required: [status, gaps, notes]
      properties:
        status: { type: string }
        gaps: { type: array, items: { $ref: "#/components/schemas/Gap" } }
        notes: { type: array, items: { type: string } }
    Completeness:
      type: object
      required: [overall, channels, network_evidence]
      properties:
        overall: { type: string, description: "complete, partial or failed" }
        recovered: { type: boolean }
        loss_window_seconds: { type: [number, "null"] }
        network_evidence: { type: string }
        channels: { type: object, additionalProperties: { $ref: "#/components/schemas/Channel" } }
        local_exclusions: { $ref: "#/components/schemas/LocalExclusions" }
        paused: { $ref: "#/components/schemas/PausedPeriods" }
    PausedPeriods:
      type: object
      description: "Recorder contract 1.7: when the person paused the recording. Nothing was captured meanwhile, by their choice: not a gap."
      required: [count, seconds, periods]
      properties:
        count: { type: integer, minimum: 0, description: "How many times the recording was paused." }
        seconds: { type: number, minimum: 0, description: "How long it was paused in all." }
        periods:
          type: array
          description: "Each pause (at most 50)."
          items:
            type: object
            required: [from, to, seconds]
            properties:
              from: { type: string, format: date-time }
              to: { type: string, format: date-time }
              seconds: { type: number, minimum: 0 }
    LocalExclusions:
      type: object
      description: "Recorder contract 1.5: applications the recording PC's own exclude list kept out. Not a gap: they were never meant to be recorded. Names of the exclude entries only."
      required: [count, names, entries, managed]
      properties:
        count: { type: integer, minimum: 0, description: "How many applications were excluded." }
        names: { type: array, items: { type: string }, description: "The exclude entries' names (Microsoft Word), never a title or address." }
        entries: { type: integer, minimum: 0, description: "How many entries the PC's exclude list had." }
        managed: { type: boolean, description: "An office's managed policy file was part of the list." }
    Preflight:
      type: object
      required: [ready, checks]
      properties:
        ready: { type: boolean }
        checks:
          type: array
          items:
            type: object
            required: [name, ok]
            properties:
              name: { type: string }
              ok: { type: boolean }
              detail: { type: [string, "null"] }
    RecordingStatus:
      type: object
      required: [label, summary, attention, accepted, accepted_by, accepted_at, workstation, completeness, preflight]
      properties:
        label: { type: string }
        summary: { type: string }
        attention: { type: boolean, description: "Partial or failed, and nobody accepted it." }
        accepted: { type: boolean }
        accepted_by: { type: [string, "null"] }
        accepted_at: { type: [string, "null"] }
        workstation: { type: boolean, description: "Sent by a recorder (not an imported event log)." }
        completeness: { oneOf: [{ $ref: "#/components/schemas/Completeness" }, { type: "null" }] }
        preflight: { oneOf: [{ $ref: "#/components/schemas/Preflight" }, { type: "null" }] }
    RecordingSummary:
      type: object
      required: [id, name, machine, received_at, automation, apps, apps_list, status]
      properties:
        id: { type: string }
        name: { type: string }
        machine: { type: [string, "null"], description: "Null for an imported recording." }
        received_at: { type: [string, "null"] }
        automation: { type: [string, "null"] }
        apps:
          type: [string, "null"]
          deprecated: true
          description: "Deprecated: use `apps_list`. The applications recorded as one text, e.g. `Billing Desk (full), CaseDesk (steps)`."
        apps_list:
          type: array
          description: The applications recorded, by name.
          items:
            type: object
            required: [app_id, name, mode]
            properties:
              app_id: { type: integer }
              name: { type: string }
              mode: { type: string, description: "What was recorded of it: `full` or `steps`." }
        status: { $ref: "#/components/schemas/RecordingStatus" }
    RecordingList:
      type: object
      required: [recordings, page]
      properties:
        recordings: { type: array, items: { $ref: "#/components/schemas/RecordingSummary" } }
        page: { $ref: "#/components/schemas/Page" }
    RecordingEvents:
      type: object
      required: [events, page, sources, screens]
      properties:
        events: { type: array, items: { $ref: "#/components/schemas/Event" } }
        page: { $ref: "#/components/schemas/Page" }
        sources:
          type: array
          description: The events per source (application) of the whole recording.
          items:
            type: object
            required: [source, count]
            properties:
              source: { type: string }
              count: { type: integer }
        screens:
          type: array
          description: The events per screen of the chosen source (or the whole recording), in first-reached order.
          items:
            type: object
            required: [screen, count]
            properties:
              screen: { type: [string, "null"], description: "null: events with no screen." }
              count: { type: integer }
        ids: { type: array, items: { type: string }, description: "With `ids=true`: the event_id of every matching event." }
    RecordingImport:
      type: object
      required: [name, log]
      properties:
        name: { type: string }
        log: { type: string, contentMediaType: application/jsonl, description: "A recording file (steps.jsonl)" }
    Event:
      type: object
      required: [event_id, seq, action, source, in_gap]
      properties:
        event_id: { type: string }
        seq: { type: integer }
        action: { type: string }
        source: { type: string }
        key: { type: [string, "null"] }
        control: { type: [string, "null"] }
        label: { type: [string, "null"] }
        screen: { type: [string, "null"] }
        time: { type: [string, "null"] }
        channel: { type: [string, "null"] }
        app: { type: [string, "null"], description: "The application whose recorded flow has the event (the events operation only)." }
        in_gap: { type: boolean, description: "Recorded in an interrupted period." }
    EvidencePreview:
      type: object
      required: [app_id, name, count, reviewed, suggested, events]
      properties:
        app_id: { type: integer }
        name: { type: string }
        count: { type: integer }
        reviewed: { type: boolean }
        suggested: { type: integer }
        events: { type: array, items: { $ref: "#/components/schemas/Event" }, description: "The first selected events." }
    RecordedApp:
      type: object
      description: One application the recording holds, with its own steps and its own latest package.
      required: [app_id, name, status, status_label, level, key, steps, my_role, latest_package]
      properties:
        app_id: { type: integer }
        name: { type: string }
        status: { $ref: "#/components/schemas/AppStatus" }
        status_label: { type: string }
        level: { type: string, enum: [full, steps] }
        key: { type: string }
        steps: { type: array, items: { $ref: "#/components/schemas/FlowStep" } }
        my_role: { oneOf: [{ $ref: "#/components/schemas/Role" }, { type: "null" }] }
        latest_package:
          description: The application's latest builder-approved revision; null when none, or the caller is not a builder of it.
          oneOf: [{ $ref: "#/components/schemas/PackageRevisionSummary" }, { type: "null" }]
    Lane:
      type: object
      required: [label, status, gaps]
      properties:
        label: { type: string }
        status: { type: string }
        gaps:
          type: array
          items:
            type: object
            required: [text]
            properties:
              left: { type: [number, "null"], description: "Percent from the start of the session." }
              width: { type: [number, "null"] }
              text: { type: string }
              reason: { type: [string, "null"] }
    RecordingRefs:
      type: object
      description: What the recorder sent about a recording made on a paired machine.
      required: [machine, automation, session, contract, timeline, ranges, apps]
      properties:
        machine: { type: [string, "null"], description: "Null when the machine was revoked." }
        automation: { type: [string, "null"] }
        session:
          type: object
          required: [id]
          properties:
            id: { type: string }
            started: { type: [string, "null"] }
            ended: { type: [string, "null"] }
            state: { type: [string, "null"] }
        contract:
          oneOf:
            - type: object
              required: [recorder, recorder_version, contract_version]
              properties:
                recorder: { type: string }
                recorder_version: { type: string }
                contract_version: { type: string }
                twinlab_commit: { type: [string, "null"] }
            - { type: "null" }
        timeline:
          type: array
          items:
            type: object
            required: [app, name, steps]
            properties:
              app: { type: string, description: "An identity key, or `presence` for other applications." }
              name: { type: string }
              steps: { type: integer }
        ranges: { type: array, items: { $ref: "#/components/schemas/Lane" } }
        apps: { type: array, items: { $ref: "#/components/schemas/RecordedApp" } }
    UploadProgress:
      type: object
      required: [text, percent, complete]
      properties:
        text: { type: string }
        percent: { type: [number, "null"] }
        complete: { type: boolean }
    RecordingDetail:
      type: object
      required: [id, name, status, upload, preview, refs, events, events_total, assignable_apps]
      properties:
        id: { type: string }
        name: { type: string }
        status: { $ref: "#/components/schemas/RecordingStatus" }
        upload: { oneOf: [{ $ref: "#/components/schemas/UploadProgress" }, { type: "null" }] }
        preview: { type: array, items: { $ref: "#/components/schemas/EvidencePreview" } }
        refs: { oneOf: [{ $ref: "#/components/schemas/RecordingRefs" }, { type: "null" }], description: "Null for an imported event log." }
        events: { type: array, items: { $ref: "#/components/schemas/Event" }, description: "The first 200 events." }
        events_total: { type: integer, description: "Every event of the recording." }
        assignable_apps:
          type: array
          description: Applications the caller owns, to assign events to.
          items: { $ref: "#/components/schemas/AppRef" }
    Assignment:
      type: object
      required: [app_id, recording_id, revision, saved, removed, reviewed, selected, suggested, notes]
      properties:
        app_id: { type: integer }
        recording_id: { type: string }
        revision: { $ref: "#/components/schemas/Revision" }
        saved: { type: boolean, description: "False when no events are assigned (none yet, or removed)." }
        removed: { type: boolean, description: "An owner removed this application's assignment from the recording." }
        reviewed: { type: boolean, description: "False when selected automatically from the recording." }
        selected: { type: array, items: { type: string }, description: "event_ids" }
        suggested: { type: array, items: { type: string }, description: "event_ids new in a later send, not yet reviewed" }
        notes: { type: string }
    AssignmentInput:
      type: object
      required: [events]
      properties:
        events: { type: array, items: { type: string }, minItems: 1, description: "event_ids of this recording" }
        notes: { type: string }
        expected_revision: { $ref: "#/components/schemas/Revision" }

    # -- capture ----------------------------------------------------------------------------------
    CaptureTarget:
      type: object
      required: [app_id, name, level]
      properties:
        app_id: { type: integer }
        name: { type: string }
        level: { type: string, enum: [full, steps] }
    CaptureSession:
      type: object
      required: [id, name, status, machine, automation, targets, recording_id, created_by, created_at]
      properties:
        id: { type: integer }
        name: { type: string }
        status: { type: string, description: "offered (shown as requested), recording, recorded, withdrawn, …" }
        machine: { type: string }
        automation: { type: [string, "null"] }
        targets: { type: array, items: { $ref: "#/components/schemas/CaptureTarget" } }
        recording_id: { type: [string, "null"] }
        created_by: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    CapturePage:
      type: object
      required: [sessions, machines, apps, automations]
      properties:
        sessions: { type: array, items: { $ref: "#/components/schemas/CaptureSession" } }
        machines: { type: array, items: { $ref: "#/components/schemas/AppRef" }, description: "The caller's paired machines, not revoked." }
        apps:
          type: array
          description: Applications the caller owns (not marked not replicated).
          items:
            type: object
            required: [id, name, identity_count]
            properties:
              id: { type: integer }
              name: { type: string }
              identity_count: { type: integer }
        automations: { type: array, items: { $ref: "#/components/schemas/AutomationRef" } }
    NewCaptureSession:
      type: object
      required: [name, machine_id, targets]
      properties:
        name: { type: string, maxLength: 120 }
        machine_id: { type: integer }
        automation_id: { type: [integer, "null"] }
        targets:
          type: array
          minItems: 1
          items:
            type: object
            required: [app_id, level]
            properties:
              app_id: { type: integer }
              level: { type: string, enum: [full, steps] }

    # -- machines ---------------------------------------------------------------------------------
    Machine:
      type: object
      required: [id, name, paired_by, paired_at, last_seen, recorder, contract_version, revoked_at, scopes]
      properties:
        id: { type: integer }
        name: { type: string }
        paired_by: { type: string }
        paired_at: { $ref: "#/components/schemas/Timestamp" }
        last_seen: { type: [string, "null"] }
        recorder: { type: string }
        contract_version: { type: [string, "null"] }
        revoked_at: { type: [string, "null"] }
        scopes: { type: array, items: { $ref: "#/components/schemas/AgentScope" }, description: "What its token may do." }
    MachineList:
      type: object
      required: [machines, code_minutes]
      properties:
        machines: { type: array, items: { $ref: "#/components/schemas/Machine" } }
        code_minutes: { type: integer }
    PairingCode:
      type: object
      required: [code, display, minutes, expires_at, scopes]
      properties:
        code: { type: string, pattern: "^[A-HJ-NP-Z2-9]{10}$" }
        display: { type: string, description: "The code as shown, XXXXX-XXXXX." }
        minutes: { type: integer }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        scopes: { type: array, items: { $ref: "#/components/schemas/AgentScope" } }
    PairingCodeInput:
      type: object
      additionalProperties: false
      properties:
        scopes:
          type: array
          items: { $ref: "#/components/schemas/AgentScope" }
          description: "What the paired machine may do; default both."
    AgentScope:
      type: string
      enum: [record, upload]
      description: "`record`: sessions offered, applications, a recording's references; `upload`: evidence uploads."

    # -- automations ------------------------------------------------------------------------------
    Automation:
      type: object
      required: [id, name, kind, notes, apps]
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { type: string }
        notes: { type: string }
        apps: { type: [string, "null"], description: "The applications it touches, comma separated." }
    AutomationPage:
      type: object
      required: [automations, apps]
      properties:
        automations: { type: array, items: { $ref: "#/components/schemas/Automation" } }
        apps: { type: array, items: { $ref: "#/components/schemas/AppRef" }, description: "Applications the caller owns." }
    NewAutomation:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
        kind: { type: string, maxLength: 40 }
        notes: { type: string, maxLength: 2000 }
        apps: { type: array, items: { type: integer } }
    AutomationDetail:
      type: object
      required: [automation, apps, recordings]
      properties:
        automation: { $ref: "#/components/schemas/Automation" }
        apps: { type: array, items: { $ref: "#/components/schemas/AppRef" } }
        recordings:
          type: array
          items:
            type: object
            required: [id, name, received_at]
            properties:
              id: { type: string }
              name: { type: string }
              received_at: { type: [string, "null"] }

    # -- releases ---------------------------------------------------------------------------------
    ReleaseSummary:
      type: object
      required: [id, version, label, revision, commit_sha, archive_sha, state]
      properties:
        id: { type: integer }
        version: { type: string, description: "The release's unique name in its application (the commit, 12 characters)." }
        label:
          type: string
          description: |
            The readable number `<package>.<build>`: the builder package revision the release was built
            from and the count of releases built from it, oldest first (e.g. `1.2`). Shown as
            `<app> <label> (<commit, 7 characters>)`.
        revision: { type: string }
        commit_sha: { type: string }
        archive_sha: { type: string }
        state: { $ref: "#/components/schemas/ReleaseState" }
    Deployment:
      type: object
      required: [environment, url, username, secret_ref, verification, label, reason, observed_commit, checked_at]
      properties:
        environment: { type: string }
        url: { type: string }
        username: { type: string }
        secret_ref: { type: string }
        verification: { type: string, description: "verified, mismatch, unreachable, unchecked, …" }
        label: { type: string }
        reason: { type: string }
        observed_commit: { type: [string, "null"] }
        checked_at: { type: [string, "null"] }
    ReleaseTest:
      type: object
      required: [commit_sha, platform, launch, reset_result, reset_notes, tested_by, tested_at, results, scope]
      properties:
        commit_sha: { type: string }
        platform: { type: string }
        launch: { type: string }
        reset_result: { type: string, enum: [pass, fail] }
        reset_notes: { type: string }
        tested_by: { type: string }
        tested_at: { $ref: "#/components/schemas/Timestamp" }
        results:
          type: array
          items:
            type: object
            required: [name, result]
            properties:
              id: { type: string }
              name: { type: string }
              result: { $ref: "#/components/schemas/TestResult" }
        scope: { $ref: "#/components/schemas/VerifiedScope" }
    VerifiedScope:
      type: object
      description: |
        What the release's evidence covers, so "Tested" never says more than was checked. Also in
        the verification report (`scope`).
      required: [commit_sha, platform, tested_by, role, method, scenarios_total, scenarios_run, scenarios_passed,
                 scenarios, deployment_url, tested_at, label]
      properties:
        commit_sha: { type: string }
        platform: { type: string, description: "The supported platform the scenarios ran on." }
        tested_by: { type: string }
        role:
          type: [string, "null"]
          description: The tester's role on the application (`owner`, `builder`, `viewer`, or `admin`); null when unknown.
        method:
          type: string
          enum: [manual, twinlab]
          description: "`manual`: results recorded by hand; `twinlab`: Twin Lab's own replay."
        scenarios_total: { type: integer }
        scenarios_run: { type: integer, description: "Scenarios with a pass or fail result." }
        scenarios_passed: { type: integer }
        scenarios:
          type: array
          items:
            type: object
            required: [id, name, result]
            properties:
              id: { type: [string, "null"] }
              name: { type: string }
              result: { $ref: "#/components/schemas/TestResult" }
        deployment_url: { type: [string, "null"], description: "The deployment the scenarios ran against (verified to report the commit)." }
        tested_at: { $ref: "#/components/schemas/Timestamp" }
        label: { type: string, description: "The one-line summary the release page shows." }
    CheckSummary:
      type: object
      required: [repository, pr_number, source_ref, platform, required, windows, checked_at, checks, reasons, reports]
      properties:
        repository: { type: [string, "null"] }
        pr_number: { type: [integer, "null"] }
        source_ref: { type: [string, "null"] }
        platform: { type: string }
        required:
          type: array
          items:
            type: object
            required: [pattern, state]
            properties:
              pattern: { type: string }
              state: { type: string }
        windows:
          type: object
          required: [required, state, checks, pattern]
          properties:
            required: { type: boolean }
            state: { type: string }
            checks: { type: array, items: { type: string } }
            pattern: { type: string }
        checked_at: { type: [string, "null"] }
        checks:
          type: array
          items:
            type: object
            required: [name, kind, conclusion]
            properties:
              name: { type: string }
              kind: { type: string, enum: [status, check_run] }
              conclusion: { type: string }
              url: { type: [string, "null"] }
              completed_at: { type: [string, "null"] }
        reasons: { type: array, items: { type: string }, description: "Why the release is not ready for Tested." }
        reports:
          type: array
          items:
            type: object
            description: Latest first.
            required: [id, number, latest, created_at, sha256, tested, requested_by]
            properties:
              id: { type: integer }
              number: { type: integer, minimum: 1, description: "1 for the release's first report." }
              latest: { type: boolean }
              created_at: { $ref: "#/components/schemas/Timestamp" }
              sha256: { type: string }
              tested: { type: [boolean, "null"], description: "The report's outcome: true when it made the release Tested; null when unknown." }
              requested_by: { type: [string, "null"], description: "Who started the verification; null for a report stored before verification jobs." }
    ReleaseDetail:
      type: object
      required: [release, app, my_role, can_download, deployments, test, scenarios, results, checks, version_path]
      properties:
        release:
          allOf:
            - { $ref: "#/components/schemas/ReleaseSummary" }
            - type: object
              required: [published_at, repository, pr_number, source_ref]
              properties:
                published_at: { type: [string, "null"] }
                repository: { type: [string, "null"] }
                pr_number: { type: [integer, "null"] }
                source_ref: { type: [string, "null"] }
        app: { $ref: "#/components/schemas/AppRef" }
        my_role: { oneOf: [{ $ref: "#/components/schemas/Role" }, { type: "null" }] }
        can_download: { type: boolean, description: "Published, or the caller is a builder or owner." }
        deployments: { type: array, items: { $ref: "#/components/schemas/Deployment" } }
        test: { oneOf: [{ $ref: "#/components/schemas/ReleaseTest" }, { type: "null" }] }
        scenarios:
          type: array
          description: The build brief's scenarios, to record a result for each.
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
        results: { type: array, items: { $ref: "#/components/schemas/TestResult" } }
        checks: { $ref: "#/components/schemas/CheckSummary" }
        version_path: { type: string, description: "The deployment's version path, `.twinlab/version`." }
        verification: { oneOf: [{ $ref: "#/components/schemas/Verification" }, { type: "null" }], description: "The latest verification of the release." }
        notice: { type: [string, "null"] }
    DeploymentInput:
      type: object
      required: [environment, url]
      properties:
        environment: { type: string }
        url: { type: string, format: uri }
        username: { type: string }
        secret_ref: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:/#@-]{0,255}$" }
    DeploymentCheck:
      type: object
      required: [environment]
      properties:
        environment: { type: string }
    TestInput:
      type: object
      required: [commit, platform, launch, reset_result, results]
      properties:
        commit: { type: string }
        platform: { type: string }
        launch: { type: string }
        reset_result: { type: string, enum: [pass, fail] }
        reset_notes: { type: string }
        results:
          type: object
          description: Per brief scenario id, its result.
          additionalProperties: { $ref: "#/components/schemas/TestResult" }

    # -- setup ------------------------------------------------------------------------------------
    SetupPage:
      type: object
      required: [apps, storage]
      properties:
        apps: { type: array, items: { $ref: "#/components/schemas/AppRef" }, description: "Applications the caller owns." }
        storage:
          type: [object, "null"]
          description: The artifact storage, described without credentials; null for everyone but portal admins.
          additionalProperties: { type: [string, boolean, number, "null"] }
    Worker:
      type: object
      required: [id, started_at, seen_at, current_job, stopped_at, state]
      properties:
        id: { type: string }
        started_at: { type: string }
        seen_at: { type: string }
        current_job: { type: [string, "null"] }
        stopped_at: { type: [string, "null"] }
        state: { type: string, enum: [running, stopped, stale] }
    Job:
      type: object
      required: [id, type, state, attempts, due, lease_owner, error]
      properties:
        id: { type: string }
        type: { type: string }
        state: { type: string }
        attempts: { type: integer }
        due: { type: [string, "null"], description: "lease_until or run_after" }
        lease_owner: { type: [string, "null"] }
        error: { type: [string, "null"] }
    BuildSetup:
      type: object
      required: [devin, devin_error, github, saved, settings, repos, providers, workers, jobs, job_counts, lease_seconds, dev_worker, budget, claude_budget]
      properties:
        devin:
          type: object
          required: [api_key_set, api_key_source, org_id, org_id_source, base_url]
          properties:
            api_key_set: { type: boolean }
            api_key_source: { type: [string, "null"] }
            org_id: { type: [string, "null"] }
            org_id_source: { type: [string, "null"] }
            base_url: { type: string }
        devin_error: { type: [string, "null"] }
        github:
          type: object
          required: [token_set, source, api]
          properties:
            token_set: { type: boolean }
            source: { type: [string, "null"] }
            api: { type: string }
        saved:
          type: object
          description: For each secret setting, whether a value is saved (never the value).
          additionalProperties: { type: boolean }
        settings:
          type: object
          description: The saved non-secret settings.
          additionalProperties: { type: [string, "null"] }
        repos: { type: array, items: { $ref: "#/components/schemas/Repo" } }
        providers: { type: array, items: { $ref: "#/components/schemas/Provider" } }
        workers: { type: array, items: { $ref: "#/components/schemas/Worker" } }
        jobs: { type: array, items: { $ref: "#/components/schemas/Job" } }
        job_counts: { type: object, additionalProperties: { type: integer } }
        lease_seconds: { type: integer }
        dev_worker: { type: boolean, description: "Whether starting a worker from the page is allowed (development)." }
        budget: { type: number, description: "Default ACU budget (Devin)." }
        claude_budget: { type: number, description: "Default Claude budget (USD)." }
    BuildSettingsInput:
      type: object
      required: [settings]
      properties:
        settings:
          type: object
          description: |
            Keys: DEVIN_API_KEY, DEVIN_ORG_ID, DEVIN_BASE_URL, GITHUB_TOKEN, GITHUB_API, DEFAULT_ACU_BUDGET,
            ANTHROPIC_API_KEY, CLAUDE_MODEL, DEFAULT_CLAUDE_BUDGET_USD, COPILOT_GITHUB_TOKEN, COPILOT_MODEL.
          additionalProperties: { type: string }
        clear:
          type: array
          description: Secret keys whose saved value is removed.
          items: { type: string, enum: [DEVIN_API_KEY, GITHUB_TOKEN, ANTHROPIC_API_KEY, COPILOT_GITHUB_TOKEN] }
    ConnectionCheck:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [service, ok, message]
            properties:
              service: { type: string, enum: [devin, github] }
              ok: { type: boolean }
              message: { type: string }

    # -- users ------------------------------------------------------------------------------------
    LocalUser:
      type: object
      required: [name, has_password, is_admin, created_by, created_at]
      properties:
        name: { type: string }
        has_password: { type: boolean }
        is_admin: { type: boolean }
        created_by: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    UserList:
      type: object
      required: [users]
      properties:
        users: { type: array, items: { $ref: "#/components/schemas/LocalUser" } }
    UserInput:
      type: object
      required: [is_admin]
      properties:
        password: { type: string, description: "Empty or omitted keeps the saved password." }
        is_admin: { type: boolean }

    RecorderRelease:
      type: object
      description: One recorder release (an MSI) the portal serves.
      required: [version, file, url, size, sha256]
      properties:
        version: { type: string, pattern: '^\d+\.\d+\.\d+$', example: "0.3.0" }
        file: { type: string, example: TwinLabRecorder-0.3.0-x64.msi }
        url: { type: string, description: Where to download it, on this portal., example: /api/agent/update/TwinLabRecorder-0.3.0-x64.msi }
        size: { type: integer, description: Bytes. }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        notes: { type: string, description: What changed, in words. }
        published_at: { type: [string, "null"], format: date-time }
    RecorderUpdate:
      type: object
      description: The answer to a recorder asking for a newer version of itself.
      required: [update_available, latest]
      properties:
        current: { type: [string, "null"], description: The version the recorder said it is. }
        update_available: { type: boolean, description: "`latest` is newer than `current`." }
        latest: { oneOf: [{ $ref: "#/components/schemas/RecorderRelease" }, { type: "null" }] }
    AgentMessage:
      type: object
      description: A recorder message as RECORDER-CONTRACT.md defines it (with `contract_version`).
      additionalProperties: true

  # -----------------------------------------------------------------------------------------------
  # examples: one coherent catalog; the web app's tests serve these through MSW.
  #   users: ana (owner of Billing Desk and CaseDesk), ben (builder on Billing Desk),
  #   vic (viewer on Billing Desk), root (portal admin)
  #   apps: 1 Billing Desk (web), 2 CaseDesk (desktop), 3 Outlook (discovered)
  #   recording 9f2c4e1a7b3d5f60 holds Billing Desk and CaseDesk, each with its own steps and package
  # -----------------------------------------------------------------------------------------------
    ScopeLabel:
      type: object
      required: [value, label, decision]
      properties:
        value: { $ref: "#/components/schemas/AppStatus" }
        label: { type: string }
        decision: { type: [string, "null"], enum: [replicate, not_replicated, null], description: "The triage decision that sets it." }
    IdentityView:
      type: object
      required: [key, display, surface, facts]
      properties:
        key: { type: string }
        display: { type: string, description: "Host and path, program file, or mainframe host." }
        surface: { type: string, description: "web, desktop or mainframe." }
        facts:
          type: object
          description: What the recorder told of a program (exe, company, product, version, toolkit).
          additionalProperties: { type: string }
    PackageReadiness:
      type: object
      required: [state, rev, blockers, warnings, up_to_date, reason]
      properties:
        state: { type: string, enum: [none, draft, frozen], description: "`draft`: changes not frozen yet." }
        rev: { type: [integer, "null"], description: "The latest frozen revision." }
        blockers: { type: [integer, "null"], description: "Critical readiness gaps (null: not checked)." }
        warnings: { type: [integer, "null"], description: "Important readiness gaps." }
        up_to_date: { type: [boolean, "null"], description: "The draft is the latest frozen revision (owners)." }
        reason: { type: string }
    BuildBrief:
      type: object
      required: [id, state, state_label, outstanding, head_sha]
      properties:
        id: { type: integer }
        state: { type: string }
        state_label: { type: string }
        outstanding: { type: integer, description: "Questions and tool approvals waiting for an answer." }
        head_sha: { type: [string, "null"] }
    ReleaseBrief:
      type: object
      required: [id, version, state]
      properties:
        id: { type: integer }
        version: { type: string }
        state: { $ref: "#/components/schemas/ReleaseState" }
    RowAction:
      type: object
      required: [label, href, blocked]
      properties:
        label: { type: string }
        href: { type: string, description: "A web-app path." }
        blocked: { type: string, description: "Why it cannot be done yet (empty: it can)." }
    WorkboardRow:
      type: object
      required: [app_id, name, my_role, identity, scope, steps, selected, reviewed, scenarios, package, build, release, stage, action]
      properties:
        app_id: { type: integer }
        name: { type: string }
        my_role: { oneOf: [{ $ref: "#/components/schemas/Role" }, { type: "null" }] }
        identity: { oneOf: [{ $ref: "#/components/schemas/IdentityView" }, { type: "null" }] }
        scope:
          type: object
          required: [status, label]
          properties:
            status: { $ref: "#/components/schemas/AppStatus" }
            label: { type: string }
        steps: { type: integer, description: "Steps of this application in this recording." }
        selected: { type: [integer, "null"], description: "Events selected for its package (owners)." }
        reviewed: { type: [boolean, "null"], description: "Whether an owner reviewed the selection (owners)." }
        scenarios: { type: [integer, "null"], description: "Business scenarios (owners)." }
        package: { oneOf: [{ $ref: "#/components/schemas/PackageReadiness" }, { type: "null" }] }
        build: { oneOf: [{ $ref: "#/components/schemas/BuildBrief" }, { type: "null" }] }
        release: { oneOf: [{ $ref: "#/components/schemas/ReleaseBrief" }, { type: "null" }] }
        stage: { type: string, description: "The journey stage." }
        action: { oneOf: [{ $ref: "#/components/schemas/RowAction" }, { type: "null" }] }
    TimelineRun:
      type: object
      required: [from_index, to_index, start, end, steps, samples]
      properties:
        from_index: { type: integer, description: "Position of its first step among all the recording's steps." }
        to_index: { type: integer }
        start: { type: [string, "null"] }
        end: { type: [string, "null"] }
        steps: { type: integer }
        samples: { type: array, items: { type: string }, description: "Up to five of its steps, as text." }
    TimelineLane:
      type: object
      required: [app_id, name, surface, steps, runs]
      properties:
        app_id: { type: integer }
        name: { type: string }
        surface: { type: string }
        steps: { type: integer }
        runs: { type: array, items: { $ref: "#/components/schemas/TimelineRun" } }
    Timeline:
      type: object
      required: [axis, start, end, total, lanes]
      properties:
        axis: { type: string, enum: [time, order], description: "`order` when some step has no capture time." }
        start: { type: [string, "null"] }
        end: { type: [string, "null"] }
        total: { type: integer }
        lanes: { type: array, items: { $ref: "#/components/schemas/TimelineLane" } }
    SharedHost:
      type: object
      required: [host, apps, text]
      properties:
        host: { type: string }
        apps:
          type: array
          items:
            type: object
            required: [app_id, name, path]
            properties:
              app_id: { type: integer }
              name: { type: string }
              path: { type: string }
        text: { type: string, description: "How its steps were told apart (the longest path prefix)." }
    Workboard:
      type: object
      required: [recording, apps, counts, download_href, timeline, shared_hosts, labels]
      properties:
        recording:
          type: object
          required: [id, name, status_label]
          properties:
            id: { type: string }
            name: { type: string }
            status_label: { type: string }
        apps: { type: array, items: { $ref: "#/components/schemas/WorkboardRow" } }
        counts:
          type: object
          required: [apps, needs_decision, replicate, not_replicated, approved_packages]
          properties:
            apps: { type: integer }
            needs_decision: { type: integer }
            replicate: { type: integer }
            not_replicated: { type: integer }
            approved_packages: { type: integer, description: "Applications with a frozen package the caller builds." }
        download_href: { type: [string, "null"], description: "One ZIP of the approved packages (null: none)." }
        timeline: { $ref: "#/components/schemas/Timeline" }
        shared_hosts: { type: array, items: { $ref: "#/components/schemas/SharedHost" } }
        labels: { type: array, items: { $ref: "#/components/schemas/ScopeLabel" } }
    Suggestion:
      type: object
      required: [app_id, name, status, status_label, score, reasons, can_merge]
      properties:
        app_id: { type: integer }
        name: { type: string }
        status: { $ref: "#/components/schemas/AppStatus" }
        status_label: { type: string }
        score: { type: integer }
        reasons: { type: array, items: { type: string } }
        can_merge: { type: boolean, description: "The caller owns it too (a merge needs both)." }
    TriageCard:
      type: object
      required: [app_id, name, revision, status, status_label, surface, identities, recordings, steps, screens, controls, suggestions]
      properties:
        app_id: { type: integer }
        name: { type: string }
        revision: { type: integer }
        status: { $ref: "#/components/schemas/AppStatus" }
        status_label: { type: string }
