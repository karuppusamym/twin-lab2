    get:
      tags: [apps]
      operationId: getMergePlan
      summary: Preview merging this application into another
      description: Owner of both applications. Nothing changes; `fingerprint` confirms exactly this plan.
      x-twinlab-role: owner of both applications
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MergePlan" }
