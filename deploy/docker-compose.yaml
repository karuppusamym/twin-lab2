# The portal on PostgreSQL in Docker, to try the shared-deployment setup on one machine:
#
#   docker compose -f deploy/docker-compose.yaml up --build
#   docker compose -f deploy/docker-compose.yaml exec portal python -m twinlab2.portal user alice --admin --password
#   open http://127.0.0.1:8766 and sign in as alice (individual mode: everyone has their own password;
#   TWINLAB2_PASSWORD below signs in only as the demo identity `demo`, never an admin).
#   To try the OAuth-proxy mode, set TWINLAB2_AUTH_MODE: trusted-proxy and TWINLAB2_TRUSTED_PROXIES
#   to the address you send X-Forwarded-User from: the port is then for testing only.
#
# Change both passwords before anyone else can reach it. To bring an existing catalog in, start
# only the database, copy, then start the portal:
#
#   docker compose -f deploy/docker-compose.yaml up -d postgres
#   python -m twinlab2.migrations copy .state/catalog.db postgresql://twinlab2:twinlab2@127.0.0.1:55433/twinlab2
#   (and copy .state/artifacts into the `artifacts` volume, as the copy reminds you)
#   docker compose -f deploy/docker-compose.yaml up --build portal
name: twinlab2
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: twinlab2
      POSTGRES_PASSWORD: twinlab2
      POSTGRES_DB: twinlab2
      # byte-order collation, as SQLite sorts (see "Portable SQL rules" in the README)
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
    ports: ["127.0.0.1:55433:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "twinlab2"]
      interval: 2s
      retries: 30
  portal:
    build: {context: .., dockerfile: deploy/Dockerfile}
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://twinlab2:twinlab2@postgres:5432/twinlab2
      TWINLAB2_ARTIFACT_DIR: /artifacts
      TWINLAB2_SECRET_KEY: change-me-to-a-long-random-value
      TWINLAB2_AUTH_MODE: individual
      TWINLAB2_PASSWORD: change-me  # signs in only as TWINLAB2_SHARED_USER (default `demo`)
      TWINLAB2_SECURE_COOKIES: "0"
      TWINLAB2_HOSTS: 127.0.0.1,localhost
    # no OAuth proxy here: listen on the container's interface and sign in with the password
    command: ["gunicorn", "--bind", "0.0.0.0:8080", "twinlab2.app:asgi()"]
    ports: ["127.0.0.1:8766:8080"]
    volumes: [artifacts:/artifacts]
    # the database at the current migration and the artifact store (as OpenShift's readiness probe)
    healthcheck:
      test: ["CMD", "python", "-m", "twinlab2.probe", "http", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      start_period: 60s
  worker:
    build: {context: .., dockerfile: deploy/Dockerfile}
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://twinlab2:twinlab2@postgres:5432/twinlab2
      TWINLAB2_ARTIFACT_DIR: /artifacts
      TWINLAB2_SECRET_KEY: change-me-to-a-long-random-value  # the portal's key
    command: ["python", "-m", "twinlab2.worker"]
    volumes: [artifacts:/artifacts]
    # alive while its loop writes workers.seen_at (as OpenShift's liveness probe)
    healthcheck:
      test: ["CMD", "python", "-m", "twinlab2.probe", "worker"]
      interval: 30s
      start_period: 60s
volumes:
  postgres:
  # artifact files (evidence, packs, releases), shared by the portal and the worker
  artifacts:
